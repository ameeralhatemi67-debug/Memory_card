<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const THEMES = {
  light: { canvas: '#F1F1F1', ink: '#333333', muted: '#666666', soft: '#E3E3E3', ink2: '#555555', gloss: 'rgba(255,255,255,0.16)',
           e1: '0 1px 2px rgba(0,0,0,0.12), 0 5px 12px rgba(0,0,0,0.12)', e2: '0 2px 4px rgba(0,0,0,0.12), 0 10px 24px rgba(0,0,0,0.2)', art: 'drop-shadow(0 10px 16px rgba(0,0,0,0.22))' },
  dark:  { canvas: '#333333', ink: '#F1F1F1', muted: '#BDBDBD', soft: '#444444', ink2: '#C4C4C4', gloss: 'rgba(255,255,255,0.7)',
           e1: '0 1px 2px rgba(0,0,0,0.45), 0 5px 12px rgba(0,0,0,0.4)', e2: '0 2px 6px rgba(0,0,0,0.5), 0 12px 28px rgba(0,0,0,0.55)', art: 'drop-shadow(0 10px 18px rgba(0,0,0,0.6))' }
};
// The "???" are thought bubbles: they rise and grow toward the top-right, and a wave runs through
// them in turn (hop, tilt, brighten) while the brain breathes underneath. Driven by a JS clock.
const MARKS = [{ x: 192, y: 76, tilt: 8 }, { x: 207, y: 58, tilt: 12 }, { x: 222, y: 42, tilt: 16 }];
class Component extends DCLogic {
  componentDidMount() {
    const tick = () => {
      this.now = performance.now();
      this.forceUpdate();
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
  }
  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark ? THEMES.dark : THEMES.light;
    const now = this.now || 0;
    const marks = {};
    MARKS.forEach((m, i) => {
      // gentle float on a small loop: up → right → down → left, 3px radius, 4s per loop, each mark a little out of phase
      const a = (now / 4000) * Math.PI * 2 + i * 0.8;
      const dx = 3 * Math.sin(a);
      const dy = -3 * Math.cos(a);
      marks['q' + i] = 'translate(' + (m.x + dx).toFixed(2) + ' ' + (m.y + dy).toFixed(2) + ') rotate(' + m.tilt + ')';
      marks['qo' + i] = 1;
    });
    const breathe = 1 + 0.018 * Math.sin((now / 3200) * Math.PI * 2);
    const brainTf = 'translate(100 100) scale(' + breathe.toFixed(4) + ') translate(-100 -100)';
    const starters = [
      { mono: 'De', name: 'German · A1 Basics', bg: '#80AEFF', fg: '#333333' },
      { mono: 'Py', name: 'Python · Syntax', bg: '#FFC680', fg: '#333333' },
      { mono: 'Es', name: 'Spanish · Basics', bg: dark ? '#F1F1F1' : '#333333', fg: dark ? '#333333' : '#F1F1F1' }
    ];
    return Object.assign({ t, starters, brainTf }, marks);
  }
}
</script>
