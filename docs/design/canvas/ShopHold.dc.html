<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop quick actions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,700..900&amp;family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.canvas}}; color: {{t.ink}}; font-family: 'Barlow Semi Condensed', system-ui, sans-serif;">

  <div aria-hidden="true" style="position: absolute; left: 18px; right: 86px; top: 86px; height: 54px; border-radius: 10px; background: {{t.ink}};"></div>
  <div aria-hidden="true" style="position: absolute; right: 18px; top: 86px; width: 58px; height: 54px; border-radius: 10px 27px 27px 10px; background: {{t.ink}};"></div>
  <sc-for list="{{ghost}}" as="g" hint-placeholder-count="6">
    <div aria-hidden="true" style="position: absolute; width: 172px; left: {{g.x}}px; top: {{g.y}}px; height: {{g.h}}px; border-radius: {{g.r}}; background: {{t.tile}};"></div>
  </sc-for>

  <div aria-hidden="true" style="position: absolute; inset: 0; background: rgba(15,15,15,0.66);"></div>

  <div role="group" aria-label="German · A2, 150 cards — quick actions" style="position: absolute; left: 200px; top: 300px; width: 172px; height: 250px; box-sizing: border-box; padding: 16px 14px 14px; border-radius: 18px 18px 999px 999px; background: {{t.hiTile}}; color: #333333; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 18px 40px rgba(0,0,0,0.35); transform: scale(1.04);">
    <span style="font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 56px; line-height: 1; text-align: center; padding-top: 18px;">De</span>
    <span style="text-align: center; padding-bottom: 34px;">
      <span style="display: block; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 21px; line-height: 1.05;">German · A2</span>
      <span style="display: block; font-size: 13px; font-weight: 600; margin-top: 3px; color: #555555;">150 cards</span>
    </span>
  </div>

  <sc-for list="{{badges}}" as="b" hint-placeholder-count="4">
    <button aria-label="{{b.label}}" style="position: absolute; width: 76px; height: 96px; border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; left: {{b.x}}px; top: {{b.y}}px;">
      <span style="position: relative; display: block; width: 72px; height: 72px; transform: rotate({{b.tilt}}deg);">
        <svg width="72" height="72" viewBox="-40 -40 80 80" aria-hidden="true" style="position: absolute; inset: 0;"><path d="{{b.path}}" fill="#F1F1F1" stroke="#F1F1F1" stroke-width="3" stroke-linejoin="round"/></svg>
        <span style="position: absolute; left: 22px; top: 22px; width: 28px; height: 28px; color: #333333;">
          <sc-if value="{{b.isShare}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="0 0 9.339 9.34" fill="currentColor" aria-hidden="true"><g transform="translate(-3017.3021,-1359.9964)"><path d="m 3026.205,1360.431 c -1.053,-1.053 -3.191,0.091 -4.629,0.477 -1.438,0.385 -3.862,0.463 -4.247,1.901 -0.327,1.219 2.494,2.964 3.013,2.445 l 2.237,-2.028 c 0.302,-0.274 0.713,-0.329 0.938,-0.105 0.217,0.217 0.17,0.635 -0.105,0.938 l -2.028,2.237 c -0.577,0.577 1.226,3.34 2.445,3.013 1.438,-0.385 1.516,-2.809 1.901,-4.247 0.386,-1.438 1.53,-3.576 0.477,-4.629 z"/></g></svg></sc-if>
          <sc-if value="{{b.isPin}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="0 0 9.339 9.339" fill="currentColor" aria-hidden="true"><g transform="translate(-3035.5152,-1358.9588)"><g transform="translate(-624.73788,839.34861)"><path d="m 3666.454,519.825 c -0.287,-0.287 -0.748,-0.287 -1.035,0 l -0.678,0.678 c -0.285,0.285 -0.286,0.742 -0.01,1.029 l -1.124,1.124 c 0,0.004 -0.01,0.007 -0.011,0.011 -1.051,-0.395 -2.27,-0.195 -3.152,0.596 -0.074,0.118 -0.06,0.274 0.043,0.376 l 2.282,2.282 -2.41,2.41 c -0.142,0.142 -0.142,0.37 0,0.512 0.142,0.142 0.37,0.142 0.511,0 l 2.41,-2.41 2.282,2.282 c 0.102,0.103 0.258,0.116 0.376,0.043 0.791,-0.882 0.991,-2.101 0.596,-3.152 0,-0.004 0.01,-0.007 0.011,-0.011 l 1.124,-1.124 c 0.287,0.281 0.744,0.279 1.029,-0.006 l 0.678,-0.678 c 0.287,-0.287 0.287,-0.748 0,-1.035 z"/></g></g></svg></sc-if>
          <sc-if value="{{b.isSearch}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="0 0 9.34 9.339" fill="currentColor" aria-hidden="true"><g transform="translate(-2951.3477,-1323.9333)"><g transform="translate(2465.6093,1035.8454)"><path d="m 489.632,288.088 a 3.893,3.893 0 0 0 -3.893,3.893 3.893,3.893 0 0 0 3.893,3.893 3.893,3.893 0 0 0 1.845,-0.465 l 1.69,1.69 c 0.439,0.439 1.145,0.439 1.584,0 0.439,-0.439 0.439,-1.145 0,-1.584 l -1.69,-1.69 a 3.893,3.893 0 0 0 0.465,-1.845 3.893,3.893 0 0 0 -3.893,-3.893 z m 0,1.002 a 2.891,2.891 0 0 1 2.891,2.891 2.891,2.891 0 0 1 -0.215,1.092 l -0.004,-0.004 a 2.891,2.891 0 0 1 -1.584,1.584 l 0.004,0.004 a 2.891,2.891 0 0 1 -1.092,0.216 2.891,2.891 0 0 1 -2.891,-2.891 2.891,2.891 0 0 1 2.891,-2.891 z m -1.922,2.681 a 0.367,0.367 0 0 0 -0.391,0.34 c -0.04,0.595 0.181,1.181 0.605,1.601 0.424,0.42 1.01,0.635 1.605,0.59 a 0.367,0.367 0 0 0 0.338,-0.393 0.367,0.367 0 0 0 -0.395,-0.338 c -0.383,0.029 -0.759,-0.109 -1.032,-0.38 -0.273,-0.271 -0.414,-0.647 -0.388,-1.031 a 0.367,0.367 0 0 0 -0.341,-0.389 z"/></g></g></svg></sc-if>
          <sc-if value="{{b.isSave}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="0 0 6.702 9.335" fill="currentColor" aria-hidden="true"><g transform="translate(-2998.2159,-1359.6182)"><path d="m 2998.815,1359.618 c -0.332,0 -0.598,0.267 -0.598,0.598 v 8.551 c 0,0.065 0.098,0.19 0.282,0.185 0.185,0.01 1.089,-0.742 1.598,-1.624 0.43,-0.745 0.057,-1.622 1.471,-1.622 1.266,0 1.129,1.029 1.471,1.622 0.509,0.882 1.342,1.629 1.61,1.624 0.238,0.01 0.269,-0.12 0.27,-0.185 v -8.551 c 0,-0.331 -0.266,-0.598 -0.598,-0.598 z"/></g></svg></sc-if>
        </span>
      </span>
      <span style="font-size: 14px; font-weight: 700; color: #F1F1F1;">{{b.short}}</span>
    </button>
  </sc-for>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const THEMES = {
  light: { canvas: '#F1F1F1', ink: '#333333', tile: '#C4C4C4', hiTile: '#D9D9D9' },
  dark:  { canvas: '#333333', ink: '#F1F1F1', tile: '#5A5A5A', hiTile: '#D9D9D9' }
};
function polar(fn, n) {
  let d = '';
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = fn(a);
    d += (i === 0 ? 'M' : 'L') + (Math.cos(a) * r).toFixed(2) + ' ' + (Math.sin(a) * r).toFixed(2);
  }
  return d + 'Z';
}
const SHAPES = {
  squircle: polar((a) => 31 * Math.pow(Math.pow(Math.abs(Math.cos(a)), 4) + Math.pow(Math.abs(Math.sin(a)), 4), -0.25) + 2.2 * Math.sin(4 * a + 0.8), 96),
  scallop: polar((a) => 31 + 3.2 * Math.cos(8 * a), 96),
  burst: polar((a) => 29 + 5 * Math.cos(12 * a), 120),
  blob: polar((a) => 31 + 3.5 * Math.sin(3 * a) + 2 * Math.cos(5 * a + 1), 96)
};
// Fan placed toward screen centre: the tile sits in the right column, so actions open to the left and top (RES-24 edge collision).
const BADGES = [
  { label: 'Share deck', short: 'Share', shape: 'squircle', x: 136, y: 206, tilt: -6, isShare: true },
  { label: 'Pin to favourites', short: 'Pin', shape: 'scallop', x: 250, y: 190, tilt: 8, isPin: true },
  { label: 'Find similar decks', short: 'Similar', shape: 'burst', x: 104, y: 318, tilt: 0, isSearch: true },
  { label: 'Save to a folder', short: 'Save', shape: 'blob', x: 116, y: 432, tilt: -10, isSave: true }
];
class Component extends DCLogic {
  renderVals() {
    const t = (this.props.dark ?? false) ? THEMES.dark : THEMES.light;
    const badges = BADGES.map((b) => Object.assign({ isShare: false, isPin: false, isSearch: false, isSave: false }, b, { path: SHAPES[b.shape] }));
    const ghost = [
      { x: 18, y: 196, h: 230, r: '999px 999px 18px 18px' }, { x: 200, y: 196, h: 94, r: '18px' },
      { x: 18, y: 436, h: 150, r: '18px' }, { x: 18, y: 596, h: 200, r: '999px' }, { x: 200, y: 560, h: 236, r: '18px 18px 999px 999px' }
    ];
    return { t, badges, ghost };
  }
}
</script>
</body>
</html>
