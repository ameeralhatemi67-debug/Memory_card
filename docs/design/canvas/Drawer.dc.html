  <div aria-hidden="true" style="position: absolute; right: 22px; top: 26px; width: 8px; height: 26px; color: {{t.backdropInk}};"><svg width="100%" height="100%" viewBox="0 0 2.444 8.911" fill="currentColor"><g transform="translate(-2998.7693,-1277.1094)"><g transform="translate(-455.15531,250.69204)"><circle cx="3455.146" cy="1034.107" r="1.222"/><circle cx="3455.146" cy="1030.873" r="1.222"/><circle cx="3455.146" cy="1027.639" r="1.222"/></g></g></svg></div>

  <nav aria-label="Folders" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" onPointerLeave="{{onUp}}" style="position: absolute; left: 0; top: 64px; width: 340px; bottom: 0; background: {{t.canvas}}; border-top-right-radius: 24px; overflow: hidden; box-shadow: 8px 0 24px rgba(0,0,0,0.18);">
    <a href="Settings.dc.html" aria-label="Settings" style="position: absolute; right: 14px; top: 16px; width: 48px; height: 48px; display: flex; align-items: center; justify-content: center; color: {{t.ink}};">
      <span style="display: block; width: 30px; height: 34px;"><svg width="100%" height="100%" viewBox="0 0 9.904 11.118" fill="currentColor" aria-hidden="true"><g transform="translate(-2996.8187,-1339.9974)"><path d="m 3001.771,1339.997 c -1.165,0 -0.965,1.558 -1.973,2.141 -1.009,0.582 -2.258,-0.37 -2.841,0.638 -0.582,1.009 0.867,1.615 0.867,2.779 0,1.165 -1.45,1.771 -0.867,2.779 0.582,1.009 1.832,0.056 2.841,0.638 1.009,0.582 0.809,2.141 1.973,2.141 1.165,0 0.965,-1.558 1.973,-2.141 1.009,-0.582 2.258,0.37 2.841,-0.638 0.582,-1.009 -0.867,-1.615 -0.867,-2.779 0,-1.165 1.45,-1.771 0.867,-2.779 -0.582,-1.009 -1.832,-0.056 -2.841,-0.638 -1.009,-0.582 -0.809,-2.141 -1.973,-2.141 z m 0,3.528 a 2.03,2.03 0 0 1 2.03,2.03 2.03,2.03 0 0 1 -2.03,2.03 2.03,2.03 0 0 1 -2.03,-2.03 2.03,2.03 0 0 1 2.03,-2.03 z"/></g></svg></span>
    </a>

    <sc-for list="{{folders}}" as="f" hint-placeholder-count="8">
      <div onPointerDown="{{f.down}}" onClick="{{f.click}}" onContextMenu="{{noMenu}}" style="position: absolute; left: 0; width: 340px; height: 175px; pointer-events: none; transform-origin: 50% 30%; touch-action: pan-y; top: {{f.top}}px; z-index: {{f.z}}; filter: {{f.shadow}}; transform: {{f.tf}}; opacity: {{f.op}};">

          </sc-for>

        <svg aria-hidden="true" width="340" height="175" viewBox="0 0 340 175" style="position: absolute; left: 0; top: 0; z-index: 5; pointer-events: none;">
          <defs><linearGradient id="{{f.gid}}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="{{f.c1}}"/><stop offset="1" stop-color="{{f.c2}}"/></linearGradient></defs>
          <path d="{{f.path}}" fill="url(#{{f.gid}})" style="pointer-events: auto; cursor: pointer;"/>

        <div style="position: absolute; left: 0; top: 0; height: 48px; box-sizing: border-box; padding: 6px 0 0 26px; display: flex; align-items: center; z-index: 6; pointer-events: none; white-space: nowrap; width: {{f.tabW}}px; color: {{f.text}}; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 26px; line-height: 1;">{{f.name}}</div>
        <sc-if value="{{f.isOpen}}" hint-placeholder-val="{{false}}">
          <a href="Main.dc.html" style="position: absolute; right: 16px; top: 54px; height: 20px; display: flex; align-items: center; gap: 4px; z-index: 6; pointer-events: auto; text-decoration: none; font-size: 14px; font-weight: 700; color: {{f.text}};">Open {{f.count}} <span aria-hidden="true">›</span></a>
        </sc-if>
        <sc-if value="{{f.isPlain}}" hint-placeholder-val="{{true}}">
          <span aria-hidden="true" style="position: absolute; right: 18px; top: 56px; z-index: 6; font-size: 13px; font-weight: 600; color: {{f.meta}};">{{f.count}}</span>
        </sc-if>
        <sc-if value="{{fear}}" hint-placeholder-val="{{false}}">
          <span aria-hidden="true" style="position: absolute; right: 16px; top: 49px; width: 26px; height: 26px; border-radius: 13px; background: #FF8080; color: #333333; z-index: 6; display: flex; align-items: center; justify-content: center;"><svg width="11" height="11" viewBox="0 0 6.163 6.163" fill="currentColor"><g transform="translate(-2974.2755,-1343.3503)"><g transform="translate(-1343.0628,1236.6336)"><rect x="3131.604" y="-2981.288" width="2.068" height="7.857" ry="1.034" transform="rotate(45)"/><rect x="-2978.393" y="-3136.566" width="2.068" height="7.857" ry="1.034" transform="rotate(135)"/></g></g></svg></span>
        </sc-if>
      </div>
    </sc-for>

    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <div style="position: absolute; left: 24px; right: 24px; top: 160px; text-align: center;">
        <div style="font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 40px;">Empty mind</div>
        <div style="margin-top: 8px; font-size: 16px; font-weight: 500; color: {{t.muted}};">Make a folder to start.</div>
      </div>
    </sc-if>

    <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 270px; z-index: 60; background: linear-gradient(to bottom, {{t.canvasClear}}, {{t.canvas}} 70%); pointer-events: none;"></div>

    <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
      <div role="status" style="position: absolute; left: 50%; bottom: 96px; transform: translateX(-50%); z-index: 80; display: flex; align-items: center; gap: 8px; height: 36px; padding: 0 6px 0 14px; border-radius: 18px; background: {{t.ink}}; color: {{t.canvas}}; font-size: 14px; font-weight: 700; white-space: nowrap;">
        <span>{{toast.text}}</span>
        <sc-if value="{{toast.undo}}" hint-placeholder-val="{{false}}">
          <button onClick="{{undo}}" style="height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: {{t.canvas}}; color: {{t.ink}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;">Undo</button>
        </sc-if>
        <sc-if value="{{toast.plain}}" hint-placeholder-val="{{true}}"><span style="width: 8px;"></span></sc-if>

    <button onClick="{{toggleFear}}" aria-pressed="{{fear}}" style="position: absolute; left: 20px; bottom: 32px; z-index: 70; height: 44px; padding: 0 16px; border: 0; border-radius: 22px; display: flex; align-items: center; gap: 8px; cursor: pointer; font-family: inherit; font-size: 15px; font-weight: 700; background: {{fearBg}}; color: {{fearFg}};">
      <svg width="13" height="13" viewBox="0 0 6.163 6.163" fill="currentColor" aria-hidden="true"><g transform="translate(-2974.2755,-1343.3503)"><g transform="translate(-1343.0628,1236.6336)"><rect x="3131.604" y="-2981.288" width="2.068" height="7.857" ry="1.034" transform="rotate(45)"/><rect x="-2978.393" y="-3136.566" width="2.068" height="7.857" ry="1.034" transform="rotate(135)"/></g></g></svg>
      {{fearLabel}}
    </button>
    <button onClick="{{newFolder}}" aria-label="New folder" style="position: absolute; right: 22px; bottom: 26px; z-index: 70; width: 76px; height: 60px; border: 0; padding: 0; background: transparent; color: {{t.ink}}; cursor: pointer;">
      <svg width="76" height="56" viewBox="0 0 12.718 9.075" fill="currentColor" aria-hidden="true"><g transform="translate(-2995.1018,-1321.9776)"><path d="m 2996.095,1321.978 c -0.55,0 -0.993,0.443 -0.993,0.993 v 2.482 3.384 0.571 c 0,0.912 0.734,1.645 1.645,1.645 h 9.426 c 0.912,0 1.646,-0.734 1.646,-1.645 v -3.955 c 0,-0.912 -0.734,-1.645 -1.646,-1.645 h -2.085 c -0.494,0 -0.92,-0.662 -1.189,-1.055 -0.257,-0.376 -0.494,-0.775 -0.969,-0.775 z m 4.533,2.949 c 0.336,0 0.607,0.271 0.607,0.607 v 1.019 h 1.019 c 0.336,0 0.607,0.271 0.607,0.607 0,0.336 -0.271,0.607 -0.607,0.607 h -1.019 v 1.019 c 0,0.336 -0.271,0.607 -0.607,0.607 -0.336,0 -0.607,-0.271 -0.607,-0.607 v -1.019 h -1.02 c -0.336,0 -0.606,-0.271 -0.606,-0.607 0,-0.336 0.27,-0.607 0.606,-0.607 h 1.02 v -1.019 c 0,-0.336 0.271,-0.607 0.607,-0.607 z"/></g></svg>
    </button>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const THEMES = {
  light: { canvas: '#F1F1F1', canvasClear: 'rgba(241,241,241,0)', ink: '#333333', muted: '#666666', soft: '#E3E3E3', backdrop: '#9D9D9D', backdropInk: '#5E5E5E', backdropBar: '#7E7E7E', shadow: 0.32 },
  dark:  { canvas: '#333333', canvasClear: 'rgba(51,51,51,0)', ink: '#F1F1F1', muted: '#BDBDBD', soft: '#444444', backdrop: '#4A4A4A', backdropInk: '#8A8A8A', backdropBar: '#5E5E5E', shadow: 0.5 }
};
const BLUE = '#80AEFF', PEACH = '#FFC680', RED = '#D35F5F';
const Z3 = [[BLUE, PEACH, RED], [PEACH, RED, BLUE], [RED, BLUE, PEACH]];
const START = [
  ['f0', 'Languages', 7], ['f1', 'German', 4], ['f2', 'Coding', 3], ['f3', 'Medicine', 5],
  ['f4', 'Exam Prep', 2], ['f5', 'Travel', 3], ['f6', 'History', 4], ['f7', 'Archive', 6]
].map(([id, name, decks], i) => ({ id, name, decks, tabs: Z3[i % 3] }));

// text_Mockup §2 — parametric Bézier silhouette: tab head 45px tall, shoulder S-curve (alpha 0.45), r = 28.
const W = 340, H = 175, STEP = 65, HEAD = 45, SPAN = 36, R = 28, ALPHA = 0.45, TOP = 84;
function tabWidth(name) {
  return Math.min(230, Math.max(92, name.length * 11.5 + 44));
}
function silhouette(tw) {
  const p1 = tw + ALPHA * SPAN, p2 = tw + (1 - ALPHA) * SPAN, p3 = tw + SPAN;
  return 'M' + R + ' 0 L' + tw + ' 0 C' + p1 + ' 0 ' + p2 + ' ' + HEAD + ' ' + p3 + ' ' + HEAD +
    ' L' + (W - R) + ' ' + HEAD + ' A' + R + ' ' + R + ' 0 0 1 ' + W + ' ' + (HEAD + R) +
    ' L' + W + ' ' + (H - R) + ' A' + R + ' ' + R + ' 0 0 1 ' + (W - R) + ' ' + H +
    ' L' + R + ' ' + H + ' A' + R + ' ' + R + ' 0 0 1 0 ' + (H - R) + ' L0 ' + R + ' A' + R + ' ' + R + ' 0 0 1 ' + R + ' 0 Z';
}
function gray(l) {
  const v = Math.round(Math.max(0, Math.min(100, l)) * 2.55).toString(16).padStart(2, '0');
  return '#' + v + v + v;
}
// Inverted luminance: light mode climbs 5% lighter per folder, dark mode 5% darker; each folder darkens 5% toward its base.
function shade(i, dark) {
  const start = dark ? Math.max(10, 95 - i * 5) : Math.min(90, 20 + i * 5);
  const end = dark ? Math.max(5, start - 5) : Math.max(10, start - 5);
  const text = dark ? (start >= 65 ? '#1E1E1E' : '#FFFFFF') : (start < 45 ? '#FFFFFF' : '#1E1E1E');
  return { c1: gray(start), c2: gray(end), text, meta: text === '#FFFFFF' ? 'rgba(255,255,255,0.72)' : 'rgba(30,30,30,0.72)' };
}

// ---- Motion: the text_Mockup keyframes, replayed by a JS clock so they run on any canvas ----
// Each row: [time 0..1, value, value, ...]; segments are eased with smoothstep.
const PILL_UP   = { ms: 450, rows: [[0, 90, 0], [0.6, -10, 1], [0.85, 2, 1], [1, 0, 1]] };          // pill-upward-reveal
const PILL_DOWN = { ms: 450, rows: [[0, 0, 1], [0.3, -4, 1], [0.7, 65, 0.7], [1, 110, 0]] };       // pill-downward-hide
const PILL_JUMP = { ms: 400, rows: [[0, 0, 1], [0.4, -12, 1], [0.75, -2, 1], [1, 0, 1]] };          // pill-vertical-extend
const FOLDER_IN = { ms: 600, rows: [[0, -381, -5, 0], [0.6, 14, 1, 1], [0.82, -3, -0.3, 1], [1, 0, 0, 1]] };   // x, rot, opacity
const BOUNCE    = { ms: 450, rows: [[0, 0, 1], [0.35, -9, 1.012], [0.7, 2, 0.996], [1, 0, 1]] };    // y, scale
const EXCITE    = { ms: 600, rows: [[0, 0, 1], [0.3, -7, 1.01], [0.6, 2, 1], [1, 0, 1]] };
const RECOIL    = { ms: 400, rows: [[0, 0, 0, 1, 1], [0.35, -6, -4, 1.1, 0.9], [1, 0, 60, 0.4, 0]] };    // x, y, scale, opacity

function sample(anim, elapsed) {
  const rows = anim.rows;
  const u = elapsed / anim.ms;
  if (u <= 0) return rows[0].slice(1);
  if (u >= 1) return rows[rows.length - 1].slice(1);
  let i = 1;
  while (rows[i][0] < u) i++;
  const a = rows[i - 1], b = rows[i];
  let k = (u - a[0]) / (b[0] - a[0]);
  k = k * k * (3 - 2 * k);
  return a.slice(1).map((v, j) => v + (b[j + 1] - v) * k);
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      folders: START.map((f) => Object.assign({}, f)),
      recent: ['f0', 'f1', 'f2'],
      exit: null,
      floating: null, fear: false, deleting: null, toast: null, lastDeleted: null, hoverPill: null
    };
    this.ptr = null;
    this.timer = null;
    this.suppress = false;
    this.pressed = null;
    this.pillAnim = {};     // folderId -> { anim, t }
    this.folderAnim = {};   // folderId -> { anim, t }
    this.exciteT = -1e9;
    this.t0 = 0;
    this.now = 0;
  }
  componentDidMount() {
    this.t0 = performance.now();
    const tick = () => {
      this.now = performance.now();
      this.forceUpdate();
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    clearTimeout(this.timer);
    clearTimeout(this.exitTimer);
    clearTimeout(this.toastTimer);
  }

  showToast(text, undo) {
    clearTimeout(this.toastTimer);
    this.setState({ toast: { text, undo: !!undo, plain: !undo } });
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), undo ? 3200 : 1800);
  }

  // Only the last 3 touched folders show their deck pills; the 4th one bumped out drops them into its pocket.
  select(id) {
    const s = this.state;
    const now = performance.now();
    this.folderAnim[id] = { anim: BOUNCE, t: now };
    if (s.recent[0] === id) {
      this.pillAnim[id] = { anim: PILL_JUMP, t: now };
      this.forceUpdate();
      return;
    }
    const next = [id].concat(s.recent.filter((x) => x !== id));
    const dropped = next.length > 3 ? next.pop() : null;
    this.pillAnim[id] = { anim: PILL_UP, t: now };
    if (dropped) this.pillAnim[dropped] = { anim: PILL_DOWN, t: now };
    this.setState({ recent: next, exit: dropped });
    clearTimeout(this.exitTimer);
    this.exitTimer = setTimeout(() => this.setState({ exit: null }), 620);
  }

  down(e, id) {
    if (this.state.deleting) return;
    clearTimeout(this.timer);
    const el = e.currentTarget;
    this.pressed = id;
    this.ptr = { id, y0: e.clientY, el, pid: e.pointerId };
    if (this.state.fear) return;
    this.timer = setTimeout(() => {           // hold 350ms → float with a 3% breathing pulse, drag to reorder
      try { el.setPointerCapture(this.ptr.pid); } catch (err) {}
      this.setState({ floating: id });
    }, 350);
  }

  move(e) {
    const p = this.ptr;
    if (!p) return;
    if (!this.state.floating) {
      if (Math.abs(e.clientY - p.y0) > 8) { clearTimeout(this.timer); this.pressed = null; }
      return;
    }
    const root = p.el.closest('[data-drawer-root]');
    if (!root) return;
    const rr = root.getBoundingClientRect();
    const k = rr.width / 390 || 1;
    const y = (e.clientY - rr.top) / k - 64 - TOP;
    const list = this.state.folders.slice();
    const from = list.findIndex((f) => f.id === this.state.floating);
    const to = Math.max(0, Math.min(list.length - 1, Math.floor((y + 20) / STEP)));
    if (from >= 0 && to !== from) {
      const item = list.splice(from, 1)[0];
      list.splice(to, 0, item);
      this.setState({ folders: list });
    }
  }

  up() {
    clearTimeout(this.timer);
    this.ptr = null;
    this.pressed = null;
    if (this.state.floating) {
      this.suppress = true;
      this.setState({ floating: null });
      this.showToast('New order saved');
    }
  }

  click(id) {
    if (this.suppress) { this.suppress = false; return; }
    const s = this.state;
    if (s.fear) {
      const index = s.folders.findIndex((f) => f.id === id);
      const folder = s.folders[index];
      this.folderAnim[id] = { anim: RECOIL, t: performance.now() };
      this.setState({ deleting: id });
      setTimeout(() => {
        this.setState({
          folders: this.state.folders.filter((f) => f.id !== id),
          recent: this.state.recent.filter((x) => x !== id),
          deleting: null,
          lastDeleted: { folder, index }
        });
        this.showToast('Deleted ' + folder.name, true);
      }, 420);
      return;
    }
    this.select(id);
  }

  folderMotion(f, i, now) {
    const s = this.state;
    let x = 0, y = 0, rot = 0, sc = 1, op = 1;
    const fa = this.folderAnim[f.id];
    const sinceOpen = now - this.t0;
    if (s.deleting === f.id && fa && fa.anim === RECOIL) {
      [x, y, sc, op] = sample(RECOIL, now - fa.t);
    } else if (s.floating === f.id) {                        // breathing +3% pulse, 1.7s cycle
      const w = (1 - Math.cos((now / 1700) * Math.PI * 2)) / 2;
      sc = 1 + 0.03 * w;
      y = -6 - 3 * w;
    } else if (s.fear) {                                     // 6Hz-ish nervous shiver, ±2–3.5°
      const ph = (now / 350) * Math.PI + i * 0.9;
      x = 2 * Math.sin(ph);
      y = Math.sin(ph * 1.3 + 1);
      rot = 2.6 * Math.sin(ph + 0.4) - 0.6;
    } else if (now - this.exciteT < EXCITE.ms + i * 35) {
      [y, sc] = sample(EXCITE, now - this.exciteT - i * 35);
    } else if (fa && fa.anim === BOUNCE && now - fa.t < BOUNCE.ms) {
      [y, sc] = sample(BOUNCE, now - fa.t);
    } else if (sinceOpen < FOLDER_IN.ms + i * 55) {
      [x, rot, op] = sample(FOLDER_IN, sinceOpen - i * 55);
    }
    if (this.pressed === f.id && !s.floating && !s.fear) sc *= 0.985;
    return {
      tf: 'translate(' + x.toFixed(1) + 'px, ' + y.toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg) scale(' + sc.toFixed(4) + ')',
      op: op.toFixed(3)
    };
  }

  pillMotion(f, i, k, now) {
    const s = this.state;
    const pa = this.pillAnim[f.id];
    const sinceOpen = now - this.t0;
    let y = 0, op = 1;
    if (pa && now - pa.t < pa.anim.ms + 120) {
      [y, op] = sample(pa.anim, now - pa.t - k * 40);
    } else if (sinceOpen < 360 + i * 55 + k * 45 + PILL_UP.ms) {   // pop out of the pocket after the folder lands
      [y, op] = sample(PILL_UP, sinceOpen - (360 + i * 55 + k * 45));
    } else if (!s.fear && !s.floating) {                          // idle peek: 0 → −5px → 0 every 2.8s
      y = -2.5 * (1 - Math.cos((now / 2800) * Math.PI * 2 + i * 0.95 + k * 0.6));
    }
    if (s.hoverPill === f.id + ':' + k) y -= 10;
    return { y: y.toFixed(1), op: op.toFixed(3) };
  }

  renderVals() {
    const dark = this.props.dark ?? false;
    const t = dark ? THEMES.dark : THEMES.light;
    const s = this.state;
    const now = this.now || performance.now();
    const n = s.folders.length;
    const folders = s.folders.map((f, i) => {
      const tw = tabWidth(f.name);
      const sh = shade(i, dark);
      const m = this.folderMotion(f, i, now);
      const pills = f.tabs.map((bg, k) => {
        const pm = this.pillMotion(f, i, k, now);
        const key = f.id + ':' + k;
        return {
          bg, left: tw + SPAN - 16 + k * 53, z: k + 1, y: pm.y, op: pm.op,
          aria: 'Study recent deck ' + (k + 1) + ' in ' + f.name,
          enter: () => this.setState({ hoverPill: key }),
          leave: () => this.setState({ hoverPill: null })
        };
      });
      return {
        name: f.name,
        count: f.decks + (f.decks === 1 ? ' deck' : ' decks'),
        top: TOP + i * STEP,
        z: s.floating === f.id ? 100 : i + 1,
        shadow: s.floating === f.id ? 'drop-shadow(0 22px 34px rgba(0,0,0,0.5))' : 'drop-shadow(0 6px 12px rgba(0,0,0,' + t.shadow + '))',
        tf: m.tf,
        op: m.op,
        tabW: tw,
        path: silhouette(tw),
        gid: 'fg' + (dark ? 'd' : 'l') + f.id,
        c1: sh.c1, c2: sh.c2, text: sh.text, meta: sh.meta,
        showPills: s.recent.includes(f.id) || s.exit === f.id,
        pills,
        isOpen: !s.fear && s.recent[0] === f.id,
        isPlain: !s.fear && s.recent[0] !== f.id,
        down: (e) => this.down(e, f.id),
        click: () => this.click(f.id)
      };
    });
    const toast = s.toast || { text: '', undo: false, plain: true };
    return {
      t, folders,
      empty: n === 0,
      fear: s.fear,
      fearLabel: s.fear ? 'Done' : 'Delete',
      fearBg: s.fear ? '#FF8080' : t.soft,
      fearFg: s.fear ? '#333333' : t.ink,
      ghostBars: [0, 1, 2, 3, 4, 5, 6].map((i) => ({ top: 88 + i * 84 })),
      onMove: (e) => this.move(e),
      onUp: () => this.up(),
      noMenu: (e) => e.preventDefault(),
      toggleFear: () => this.setState({ fear: !s.fear }),
      newFolder: () => {
        const id = 'n' + Date.now();
        const folders = [{ id, name: 'New folder', decks: 0, tabs: Z3[s.folders.length % 3] }].concat(s.folders);
        this.exciteT = performance.now();
        this.setState({ folders, fear: false });
        this.showToast('Folder created — rename it');
      },
      hasToast: !!s.toast,
      toast,
      undo: () => {
        const ld = s.lastDeleted;
        if (!ld) return;
        const folders = s.folders.slice();
        folders.splice(Math.min(ld.index, folders.length), 0, ld.folder);
        this.setState({ folders, lastDeleted: null, toast: null });
      }
    };
  }
}
</script>
