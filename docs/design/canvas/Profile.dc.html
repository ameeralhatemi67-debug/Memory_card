<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const THEMES = {
  light: { canvas: '#F1F1F1', ink: '#333333', onInk: '#F1F1F1', muted: '#666666', mutedOnInk: '#BDBDBD', soft: '#E3E3E3', sash: '#AEAEAE', digits: '#9A9A9A', cardFace: '#F8F8F8', faceShadow: '0 18px 40px rgba(0,0,0,0.10)',
           badge: '#333333', badgeInk: '#F1F1F1', tierBg: '#D9A273', stripe: '#1E1E1E',
           card: '0 16px 36px rgba(0,0,0,0.24)', badgeShadow: 'drop-shadow(0 6px 10px rgba(0,0,0,0.25))',
           heat: ['#474747', '#666666', '#8A8A8A', '#BDBDBD', '#F1F1F1'] },
  dark:  { canvas: '#333333', ink: '#F1F1F1', onInk: '#333333', muted: '#BDBDBD', mutedOnInk: '#666666', soft: '#444444', sash: '#8A8A8A', digits: '#8A8A8A', cardFace: '#3B3B3B', faceShadow: '0 18px 40px rgba(0,0,0,0.45)',
           badge: '#F1F1F1', badgeInk: '#333333', tierBg: '#D9A273', stripe: '#C8C8C8',
           card: '0 18px 40px rgba(0,0,0,0.6)', badgeShadow: 'drop-shadow(0 6px 12px rgba(0,0,0,0.6))',
           heat: ['#DADADA', '#BDBDBD', '#8A8A8A', '#5E5E5E', '#333333'] }
};
function polar(fn, n) {
  let d = '';
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = fn(a);
    d += (i === 0 ? 'M' : 'L') + (Math.cos(a) * r).toFixed(2) + ' ' + (Math.sin(a) * r).toFixed(2);
  }
  return d + 'Z';
}
const SHAPES = {
  scallop: polar((a) => 34 + 3.4 * Math.cos(9 * a), 108),
  burst: polar((a) => 33.5 + 4.5 * Math.cos(12 * a), 144),
  squircle: polar((a) => 34 * Math.pow(Math.pow(Math.abs(Math.cos(a)), 4) + Math.pow(Math.abs(Math.sin(a)), 4), -0.25) + 2.4 * Math.sin(4 * a + 0.8), 108)
};
// 35 days, oldest first; 0 = no study … 4 = big day. The last 8 days form the current streak.
const HEAT = [2,0,1,3,2,0,0, 1,2,2,0,3,1,0, 2,3,0,1,2,4,0, 0,1,2,3,2,1,3, 2,4,2,3,1,2,3];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { dark: null, flipped: false };
  }
  renderVals() {
    const dark = this.state.dark === null ? (this.props.dark ?? false) : this.state.dark;
    const t = dark ? THEMES.dark : THEMES.light;
    const f = this.state.flipped;
    return {
      t,
      shapes: SHAPES,
      toggleTheme: () => this.setState({ dark: !dark }),
      themeLabel: dark ? 'Switch to light mode' : 'Switch to dark mode',
      flip: () => this.setState({ flipped: !f }),
      flipDeg: f ? 180 : 0,
      flipLabel: f ? 'Membership card, back: activity and streak. Tap to flip to the front' : 'Membership card. Tap to flip and see your activity',
      flipHint: f ? 'Tap the card to flip it back' : 'Tap the card to see your activity',
      digits: [
        { value: '0142', label: 'mastered' },
        { value: '0008', label: 'streak' },
        { value: '0086', label: 'health %' },
        { value: '2026', label: 'since' }
      ],
      stats: [
        { value: '142', label: 'cards mastered' },
        { value: '86%', label: 'memory health' },
        { value: '74%', label: 'felt success' }
      ],
      heat: HEAT.map((v) => ({ bg: t.heat[v] }))
    };
  }
}
</script>
