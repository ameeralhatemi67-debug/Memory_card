<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deck swipe actions</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,700..900&amp;family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.canvas}}; color: {{t.ink}}; font-family: 'Barlow Semi Condensed', system-ui, sans-serif;">

  <header style="position: absolute; top: 0; left: 0; right: 0; height: 76px; box-sizing: border-box; padding: 18px 16px 0 18px; display: flex; align-items: center; gap: 12px;">
    <span style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; color: {{t.ink}};">
      <span style="display: block; width: 28px; height: 36px;"><svg width="100%" height="100%" viewBox="0 0 11.211 14.182" fill="currentColor" aria-hidden="true"><g transform="translate(-3014.7719,-1275.9218)"><g transform="translate(-69.860379)"><rect x="3084.633" y="1275.922" width="6.926" height="11.206" ry="0.534" fill-opacity=".55"/><rect x="3312.468" y="433.451" width="6.926" height="11.206" ry="0.534" transform="rotate(15)" fill-opacity=".78"/><rect x="3314.619" y="-438.992" width="6.926" height="11.206" ry="0.534" transform="rotate(30)"/></g></g></svg></span>
    </span>
    <div style="flex: 1; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 24px;">Languages</div>
    <span style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; color: {{t.ink}};">
      <span style="display: block; width: 8px; height: 26px;"><svg width="100%" height="100%" viewBox="0 0 2.444 8.911" fill="currentColor" aria-hidden="true"><g transform="translate(-2998.7693,-1277.1094)"><g transform="translate(-455.15531,250.69204)"><circle cx="3455.146" cy="1034.107" r="1.222"/><circle cx="3455.146" cy="1030.873" r="1.222"/><circle cx="3455.146" cy="1027.639" r="1.222"/></g></g></svg></span>
    </span>
  </header>

  <sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
    <div style="position: absolute; left: 0; right: 0; height: 72px; top: {{r.top}}px;">
      <sc-if value="{{r.hasDelete}}" hint-placeholder-val="{{false}}">
        <button aria-label="Delete deck" style="position: absolute; top: 0; height: 72px; width: 54px; border: 0; padding: 0; border-radius: 10px; background: #FF8080; color: #333333; display: flex; align-items: center; justify-content: center; cursor: pointer; left: {{r.deleteLeft}}px;">
          <svg width="20" height="20" viewBox="0 0 6.163 6.163" fill="currentColor" aria-hidden="true"><g transform="translate(-2974.2755,-1343.3503)"><g transform="translate(-1343.0628,1236.6336)"><rect x="3131.604" y="-2981.288" width="2.068" height="7.857" ry="1.034" transform="rotate(45)"/><rect x="-2978.393" y="-3136.566" width="2.068" height="7.857" ry="1.034" transform="rotate(135)"/></g></g></svg>
        </button>
      </sc-if>
      <sc-if value="{{r.hasArchive}}" hint-placeholder-val="{{false}}">
        <button aria-label="Archive deck" style="position: absolute; top: 0; left: 318px; height: 72px; width: 72px; border: 0; padding: 0 18px 0 0; border-radius: 10px 0 0 10px; background: #FFC680; color: #333333; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="20" height="22" viewBox="0 0 7.238 7.857" fill="currentColor" aria-hidden="true"><g transform="translate(-2956.0603,-1341.437)"><g transform="translate(-3327.3161,2617.0253)"><rect x="-6288.029" y="1267.731" width="2.068" height="7.857" ry="1.034" transform="scale(-1)"/><rect x="-2045.748" y="6078.048" width="2.068" height="5.051" ry="1.034" transform="rotate(-120)"/><rect x="4241.247" y="-4811.348" width="2.068" height="5.051" ry="1.034" transform="matrix(0.5,-0.8660254,-0.8660254,-0.5,0,0)"/></g></g></svg>
        </button>
      </sc-if>
      <sc-if value="{{r.hasMove}}" hint-placeholder-val="{{false}}">
        <button aria-label="Move deck to another folder" style="position: absolute; top: 0; left: 0; height: 72px; width: 62px; border: 0; padding: 0 0 0 4px; border-radius: 0 10px 10px 0; background: #80AEFF; color: #333333; display: flex; align-items: center; justify-content: center; cursor: pointer;">
          <svg width="24" height="18" viewBox="0 0 8.839 6.255" fill="currentColor" aria-hidden="true"><g transform="translate(-3036.6173,-1343.8233)"><g transform="translate(-2966.7452,2649.7719)"><rect x="-5172.804" y="3325.31" width="2.068" height="5.027" ry="1.034" transform="matrix(-0.70710678,0.70710678,0.70710678,0.70710678,0,0)"/><rect x="-3330.337" y="5167.777" width="2.068" height="5.027" ry="1.034" transform="rotate(-135)"/><rect x="-5169.497" y="3322.003" width="2.068" height="5.027" ry="1.034" transform="matrix(-0.70710678,0.70710678,0.70710678,0.70710678,0,0)"/><rect x="-3327.03" y="5164.47" width="2.068" height="5.027" ry="1.034" transform="rotate(-135)"/></g></g></svg>
        </button>
      </sc-if>
      <div style="position: absolute; top: 0; height: 72px; width: 350px; border-radius: 10px; background: {{t.ink}}; color: {{t.onInk}}; overflow: hidden; left: {{r.left}}px; -webkit-mask-image: {{r.mask}}; mask-image: {{r.mask}};">
        <div style="position: absolute; left: 16px; top: 9px; right: 120px; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 23px; line-height: 1.05; white-space: nowrap;">{{r.name}}</div>
        <div style="position: absolute; left: 16px; bottom: 9px; font-size: 13px; font-weight: 500; color: {{t.mutedOnInk}};">{{r.meta}}</div>
        <sc-for list="{{r.fan}}" as="c" hint-placeholder-count="5">
          <span style="position: absolute; width: 54px; height: 80px; border-radius: 7px; transform-origin: 100% 100%; box-shadow: -2px 0 4px rgba(0,0,0,0.2); {{c.style}}"></span>
        </sc-for>
      </div>
    </div>
  </sc-for>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 112px; height: 170px; background: linear-gradient(to bottom, {{t.canvasClear}}, {{t.canvas}} 92%);"></div>

  <nav aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 0; height: 112px; display: flex; align-items: center; justify-content: space-around; padding: 0 22px 10px; box-sizing: border-box; color: {{t.ink}};">
    <span style="display: block; width: 44px; height: 44px;"><svg width="100%" height="100%" viewBox="0 0 11.321 11.322" fill="currentColor"><g transform="translate(-3015.3506,-1319.8992)"><g transform="matrix(0.73369523,0,0,0.73369523,2071.0345,1201.7805)"><path d="m 1294.783,160.991 c -0.349,0 -0.699,0.134 -0.966,0.402 l -4.247,4.247 c -0.026,0.02 -0.051,0.042 -0.074,0.066 l -2.181,2.181 c -0.329,0.329 -0.329,0.858 0,1.187 0.329,0.329 0.858,0.329 1.187,0 l 0.076,-0.076 0,-0 2.104,-2.104 3.135,-3.135 c 0.535,-0.535 1.397,-0.535 1.933,-0 l 3.135,3.135 1.951,1.951 0.229,0.229 c 0.329,0.329 0.858,0.329 1.187,0 0.329,-0.329 0.329,-0.858 -0,-1.187 l -2.181,-2.181 c -0.024,-0.024 -0.05,-0.046 -0.076,-0.066 l -4.246,-4.246 c -0.268,-0.268 -0.617,-0.402 -0.966,-0.402 z"/><path d="m 1294.784,164.627 c -0.349,0 -0.699,0.134 -0.966,0.402 l -5.431,5.432 -0.021,0.021 c -0.148,0.153 -0.24,0.361 -0.24,0.591 h 0.001 v 2.893 1.182 c 0,0.707 0.569,1.276 1.276,1.276 h 1.182 2.262 v -3.618 c 0,-0.178 0.143,-0.321 0.321,-0.321 h 3.224 c 0.178,0 0.321,0.143 0.321,0.321 v 3.618 h 2.272 1.18 c 0.707,0 1.276,-0.569 1.276,-1.276 v -1.181 -2.894 h -0.001 c 0,-0.233 -0.093,-0.443 -0.244,-0.597 l -0.01,-0.01 -5.436,-5.436 c -0.268,-0.268 -0.617,-0.402 -0.966,-0.402 z"/></g></g></svg></span>
    <span style="display: flex; position: relative; width: 84px; height: 84px; align-items: center; justify-content: center; color: {{t.canvas}};">
      <span style="position: absolute; left: 13px; top: 13px; width: 58px; height: 58px; border-radius: 15px; background: {{t.ink}}; transform: rotate(45deg);"></span>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" style="position: relative;"><path d="M12 4.5v15M4.5 12h15"/></svg>
    </span>
    <span style="display: block; width: 48px; height: 42px;"><svg width="100%" height="100%" viewBox="0 0 11.322 9.794" fill="currentColor"><g transform="translate(-3035.2904,-1321.978)"><g transform="matrix(0.52297311,0,0,0.52297311,2612.2188,1252.0369)"><path d="m 812.241,133.738 c -0.992,0 -1.791,0.799 -1.791,1.791 -0.034,0.069 -1.488,2.963 -1.475,4.327 -0.005,1.418 0.607,2.381 1.475,2.877 1.3,0.742 3.178,0.437 4.436,-0.963 1.573,1.755 3.209,1.752 4.907,-0.011 1.524,1.701 3.173,1.704 4.946,0.011 1.023,1.257 3.009,1.581 4.389,0.824 0.866,-0.475 1.494,-1.374 1.494,-2.738 0,-1.193 -1.448,-4.229 -1.494,-4.327 0,-0.086 -0.009,-0.203 -0.021,-0.286 -0.123,-0.871 -0.864,-1.504 -1.769,-1.504 z"/><path d="m 819.793,143.182 c -1.698,1.763 -3.333,1.766 -4.907,0.011 -1.255,1.396 -3.127,1.703 -4.427,0.967 v 6.513 c 0,0.992 0.799,1.79 1.791,1.79 h 4.831 v -5.076 c 0,-0.25 0.201,-0.451 0.451,-0.451 h 4.522 c 0.25,0 0.451,0.201 0.451,0.451 v 5.076 h 4.843 c 0.992,0 1.791,-0.798 1.791,-1.79 v -6.663 c -0.003,0.002 -0.006,0.004 -0.01,0.006 -1.38,0.757 -3.366,0.434 -4.389,-0.824 -1.773,1.693 -3.422,1.689 -4.946,-0.011 z"/></g></g></svg></span>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const THEMES = {
  light: { canvas: '#F1F1F1', canvasClear: 'rgba(241,241,241,0)', ink: '#333333', onInk: '#F1F1F1', mutedOnInk: '#BDBDBD',
           fanOn: ['#8F8F8F', '#A8A8A8', '#C2C2C2', '#DADADA', '#F1F1F1'], fanOff: '#454545' },
  dark:  { canvas: '#333333', canvasClear: 'rgba(51,51,51,0)', ink: '#F1F1F1', onInk: '#333333', mutedOnInk: '#666666',
           fanOn: ['#A3A3A3', '#888888', '#6E6E6E', '#525252', '#333333'], fanOff: '#DADADA' }
};
// swipe: 0 = resting, -1 = left (delete revealed), -2 = long left (delete + archive), 1 = right (move)
const ROWS = [
  { name: 'Spanish · Basics', cards: 45, due: 12, mastered: 3, swipe: 0 },
  { name: 'Spanish · Verbs', cards: 60, due: 18, mastered: 2, swipe: 0 },
  { name: 'French · Essentials', cards: 50, due: 9, mastered: 4, swipe: -1 },
  { name: 'French · Food', cards: 36, due: 0, mastered: 5, swipe: -2 },
  { name: 'Arabic · Alphabet', cards: 28, due: 7, mastered: 1, swipe: 1 },
  { name: 'Arabic · Greetings', cards: 30, due: 15, mastered: 0, swipe: 0 },
  { name: 'English · Idioms', cards: 40, due: 0, mastered: 2, swipe: 0 }
];
class Component extends DCLogic {
  renderVals() {
    const t = (this.props.dark ?? false) ? THEMES.dark : THEMES.light;
    const rows = ROWS.map((d, i) => {
      const left = d.swipe === -1 ? -42 : d.swipe === -2 ? -96 : d.swipe === 1 ? 72 : 20;
      const mask = d.swipe < 0 ? 'linear-gradient(to right, transparent 0%, #000 52%)'
        : d.swipe > 0 ? 'linear-gradient(to left, transparent 0%, #000 52%)' : 'none';
      return {
        top: 88 + i * 84,
        name: d.name,
        meta: d.cards + ' cards · ' + (d.due ? d.due + ' slipping' : 'all fresh'),
        left, mask,
        hasDelete: d.swipe < 0,
        deleteLeft: d.swipe === -1 ? 324 : 262,
        hasArchive: d.swipe === -2,
        hasMove: d.swipe > 0,
        fan: [0, 1, 2, 3, 4].map((k) => ({
          style: 'right: ' + (-10 + (4 - k) * 15) + 'px; bottom: ' + (-40 + k * 8) + 'px; transform: rotate(' + (-16 + k * 3) + 'deg); background: ' + (k < d.mastered ? t.fanOn[k] : t.fanOff) + ';'
        }))
      };
    });
    return { t, rows };
  }
}
</script>
</body>
</html>
