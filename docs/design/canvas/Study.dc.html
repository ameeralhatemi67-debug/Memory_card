<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Study</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,700..900&amp;family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.canvas}}; color: {{t.ink}}; font-family: 'Barlow Semi Condensed', system-ui, sans-serif; user-select: none;">

  <header style="position: absolute; top: 0; left: 0; right: 0; height: 68px; box-sizing: border-box; padding: 16px 16px 0 18px; display: flex; align-items: center; gap: 12px;">
    <a href="Main.dc.html" aria-label="Back to decks" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; color: {{t.ink}};">
      <span style="display: block; width: 28px; height: 36px;"><svg width="100%" height="100%" viewBox="0 0 11.211 14.182" fill="currentColor" aria-hidden="true"><g transform="translate(-3014.7719,-1275.9218)"><g transform="translate(-69.860379)"><rect x="3084.633" y="1275.922" width="6.926" height="11.206" ry="0.534" fill-opacity=".55"/><rect x="3312.468" y="433.451" width="6.926" height="11.206" ry="0.534" transform="rotate(15)" fill-opacity=".78"/><rect x="3314.619" y="-438.992" width="6.926" height="11.206" ry="0.534" transform="rotate(30)"/></g></g></svg></span>
    </a>
    <div style="flex: 1; min-width: 0;">
      <div style="font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 23px; line-height: 1;">German · A1 Everyday</div>
      <div style="font-size: 13px; font-weight: 600; color: {{t.muted}}; margin-top: 3px;">Today {{done}} / {{goal}} · stack of {{stackSize}}</div>
    </div>
    <button aria-label="Menu" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <span style="display: block; width: 8px; height: 26px;"><svg width="100%" height="100%" viewBox="0 0 2.444 8.911" fill="currentColor" aria-hidden="true"><g transform="translate(-2998.7693,-1277.1094)"><g transform="translate(-455.15531,250.69204)"><circle cx="3455.146" cy="1034.107" r="1.222"/><circle cx="3455.146" cy="1030.873" r="1.222"/><circle cx="3455.146" cy="1027.639" r="1.222"/></g></g></svg></span>
    </button>
  </header>
  <div role="progressbar" aria-label="Daily goal" aria-valuemin="0" aria-valuemax="{{goal}}" aria-valuenow="{{done}}" style="position: absolute; top: 72px; left: 22px; right: 22px; height: 4px; border-radius: 2px; background: {{t.soft}}; overflow: hidden;">
    <div style="height: 100%; width: {{progPct}}%; background: {{t.ink}}; transition: width 300ms ease;"></div>
  </div>

  <sc-for list="{{below}}" as="b" hint-placeholder-count="3">
    <div style="position: absolute; left: 57px; width: 276px; height: 384px; border-radius: 18px; top: {{b.top}}px; background: {{b.bg}};"></div>
  </sc-for>
  <sc-for list="{{above}}" as="b" hint-placeholder-count="5">
    <div style="position: absolute; left: 57px; width: 276px; height: 384px; border-radius: 18px; top: {{b.top}}px; background: {{b.bg}};"></div>
  </sc-for>

  <div aria-hidden="true" style="position: absolute; left: 57px; top: 160px; width: 276px; height: 384px; border-radius: 18px; background: {{t.ink}}; color: {{t.onInk}}; box-sizing: border-box; padding: 20px;">
    <div style="opacity: {{nextOp}};">
      <div style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: {{t.mutedOnInk}};">{{next.pos}}</div>
      <div style="font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 34px; line-height: 1.05; margin-top: 6px;">{{next.term}}</div>
    </div>
  </div>

  <div onPointerDown="{{onDown}}" onPointerMove="{{onMove}}" onPointerUp="{{onUp}}" onPointerCancel="{{onUp}}" style="position: absolute; left: 57px; top: 160px; width: 276px; height: 384px; border-radius: 18px; background: {{t.ink}}; color: {{t.onInk}}; box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; touch-action: none; cursor: grab; transform: {{cardTf}}; transition: {{cardTr}};">
    <div style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: {{t.mutedOnInk}};">{{top.pos}}</div>
    <div style="font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 34px; line-height: 1.05; margin-top: 6px;">{{top.term}}</div>
    <div style="font-size: 17px; font-weight: 500; line-height: 1.3; margin-top: 8px; color: {{t.mutedOnInk}};">{{top.example}}</div>
    <div style="flex: 1;"></div>

      <div aria-live="polite" style="height: 56px; border-radius: 12px; background: #FFC680; color: #333333; display: flex; align-items: center; justify-content: center; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 28px; transition: background 200ms;">{{top.answer}}</div>
    </sc-if>
    <sc-if value="{{hidden}}" hint-placeholder-val="{{true}}">
      <button onClick="{{reveal}}" style="height: 56px; border: 0; border-radius: 12px; background: {{t.pill}}; color: #333333; font-family: inherit; font-size: 17px; font-weight: 600; cursor: pointer;">Tap to reveal</button>
    </sc-if>
    <button onClick="{{speak}}" aria-label="Play pronunciation" style="margin-top: 10px; height: 84px; border: 0; border-radius: 12px; background: #D35F5F; color: #F1F1F1; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 25px;">

      <span>{{speakLabel}}</span>
    </button>
  </div>

    <span style="position: absolute; left: 42px; top: 14px; width: 96px; height: 96px; border-radius: 16px; background: {{t.earBack}}; transform: rotate(-30deg);"></span>
    <span style="position: absolute; left: 48px; top: 16px; width: 96px; height: 96px; border-radius: 16px; background: {{t.ink}}; transform: rotate(45deg);"></span>

  </button>

  <sc-if value="{{hasNote}}" hint-placeholder-val="{{false}}">
    <div aria-live="polite" style="position: absolute; left: 50%; top: 650px; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 4px 0 12px; border-radius: 17px; background: {{t.soft}}; color: {{t.ink}}; font-size: 14px; font-weight: 600; white-space: nowrap;">
      <span>{{note.text}}</span>
      <sc-if value="{{note.undo}}" hint-placeholder-val="{{true}}">
        <button onClick="{{undo}}" style="display: flex; align-items: center; gap: 4px; height: 26px; padding: 0 10px; border: 0; border-radius: 13px; background: {{t.ink}}; color: {{t.canvas}}; font-family: inherit; font-size: 13px; font-weight: 700; cursor: pointer;">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 14 4 9l5-5"/><path d="M4 9h10.5a5.5 5.5 0 0 1 0 11H11"/></svg>
          Undo
        </button>
      </sc-if>
      <sc-if value="{{note.plain}}" hint-placeholder-val="{{false}}"><span style="width: 10px;"></span></sc-if>
    </div>
  </sc-if>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 112px; display: flex; align-items: center; justify-content: space-around; padding: 0 22px 10px; box-sizing: border-box;">
    <a href="Main.dc.html" aria-label="Home" style="display: flex; width: 56px; height: 56px; align-items: center; justify-content: center; color: {{t.ink}};">
      <span style="display: block; width: 44px; height: 44px;"><svg width="100%" height="100%" viewBox="0 0 11.321 11.322" fill="currentColor" aria-hidden="true"><g transform="translate(-3015.3506,-1319.8992)"><g transform="matrix(0.73369523,0,0,0.73369523,2071.0345,1201.7805)"><path d="m 1294.783,160.991 c -0.349,0 -0.699,0.134 -0.966,0.402 l -4.247,4.247 c -0.026,0.02 -0.051,0.042 -0.074,0.066 l -2.181,2.181 c -0.329,0.329 -0.329,0.858 0,1.187 0.329,0.329 0.858,0.329 1.187,0 l 0.076,-0.076 0,-0 2.104,-2.104 3.135,-3.135 c 0.535,-0.535 1.397,-0.535 1.933,-0 l 3.135,3.135 1.951,1.951 0.229,0.229 c 0.329,0.329 0.858,0.329 1.187,0 0.329,-0.329 0.329,-0.858 -0,-1.187 l -2.181,-2.181 c -0.024,-0.024 -0.05,-0.046 -0.076,-0.066 l -4.246,-4.246 c -0.268,-0.268 -0.617,-0.402 -0.966,-0.402 z"/><path d="m 1294.784,164.627 c -0.349,0 -0.699,0.134 -0.966,0.402 l -5.431,5.432 -0.021,0.021 c -0.148,0.153 -0.24,0.361 -0.24,0.591 h 0.001 v 2.893 1.182 c 0,0.707 0.569,1.276 1.276,1.276 h 1.182 2.262 v -3.618 c 0,-0.178 0.143,-0.321 0.321,-0.321 h 3.224 c 0.178,0 0.321,0.143 0.321,0.321 v 3.618 h 2.272 1.18 c 0.707,0 1.276,-0.569 1.276,-1.276 v -1.181 -2.894 h -0.001 c 0,-0.233 -0.093,-0.443 -0.244,-0.597 l -0.01,-0.01 -5.436,-5.436 c -0.268,-0.268 -0.617,-0.402 -0.966,-0.402 z"/></g></g></svg></span>
    </a>
    <a href="Editor.dc.html" aria-label="Create a card" style="display: flex; position: relative; width: 84px; height: 84px; align-items: center; justify-content: center; color: {{t.canvas}};">

    </a>
  </nav>

  <sc-if value="{{showGoal}}" hint-placeholder-val="{{false}}">
    <div role="dialog" aria-modal="true" aria-label="Daily goal reached" style="position: absolute; inset: 0; background: rgba(20,20,20,0.6); display: flex; align-items: center; justify-content: center;">
      <div style="width: 318px; box-sizing: border-box; padding: 28px 24px 22px; border-radius: 22px; background: {{t.canvas}}; color: {{t.ink}}; display: flex; flex-direction: column; align-items: center; text-align: center;">
        <svg width="96" height="96" viewBox="-50 -50 100 100" aria-hidden="true"><path d="{{seal}}" fill="#D35F5F"/><circle r="31" fill="none" stroke="#F1F1F1" stroke-opacity="0.55" stroke-width="2"/><path d="M-14 1 -4 11 15-10" fill="none" stroke="#F1F1F1" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/></svg>
        <div style="font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 34px; line-height: 1.05; margin-top: 14px;">Today's goal — done</div>
        <div style="font-size: 16px; font-weight: 500; color: {{t.muted}}; margin-top: 8px; line-height: 1.35;">{{goal}} cards reviewed · streak 8 days. The stack keeps going if you do.</div>

      </div>
    </div>
  </sc-if>
</div>
</x-dc>

  { term: 'die Wolke', pos: 'noun · feminine', example: 'Am Himmel ist keine Wolke.', answer: 'the cloud' },
  { term: 'das Geschenk', pos: 'noun · neuter', example: 'Das Geschenk ist für dich.', answer: 'the gift' }
];
const CARD_W = 276;
const REINSERT = 8;      // RES-47 §5.1: failed cards return 8–20 cards later, never closer than 5

function sealPath() {
  let d = '';
  for (let i = 0; i < 48; i++) {
    const a = (i / 48) * Math.PI * 2;
    const r = i % 2 === 0 ? 46 : 41;
    d += (i === 0 ? 'M' : 'L') + (Math.cos(a) * r).toFixed(2) + ' ' + (Math.sin(a) * r).toFixed(2);
  }
  return d + 'Z';
}
const SEAL = sealPath();

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { stack: CARDS.map((c, i) => i), revealed: false, dx: 0, anim: false, busy: false, done: 0, hist: [], note: null, showGoal: false, goalSeen: false, speaking: false, focusL: false, focusR: false };
    this.sx = 0;
    this.dragging = false;
    this.moved = false;
  }

  handleDown(e) {
    if (this.state.busy) return;
    if (e.target && e.target.closest && e.target.closest('button')) return;
    this.sx = e.clientX;
    this.dragging = true;
    this.moved = false;
    this.el = e.currentTarget;
    this.setState({ anim: false });
  }

  handleMove(e) {
    if (!this.dragging) return;
    const dx = e.clientX - this.sx;
    if (!this.moved && Math.abs(dx) > 6) {
      this.moved = true;
      try { this.el.setPointerCapture(e.pointerId); } catch (err) {}
    }
    if (this.moved) this.setState({ dx });
  }

  handleUp() {
    if (!this.dragging) return;
    this.dragging = false;
    const dx = this.state.dx;
    if (!this.moved) {
      if (!this.state.revealed) this.setState({ revealed: true, note: null });
      return;
    }
    if (Math.abs(dx) >= 0.6 * CARD_W) this.commit(dx > 0);
    else this.setState({ dx: 0, anim: true });
  }

  commit(ok) {
    if (this.state.busy) return;
    if (!this.state.revealed) {
      this.setState({ dx: 0, anim: true, note: { text: 'Tap the card to check first', undo: false, plain: true } });
      return;
    }
    this.setState({ busy: true, anim: true, dx: ok ? 640 : -640 });
    setTimeout(() => this.apply(ok), 230);
  }

  apply(ok) {
    const s = this.state;
    const top = s.stack[0];
    const rest = s.stack.slice(1);
    let text;
    if (ok) {
      rest.push(top);
      text = 'Sent to the back';
    } else {
      const n = Math.min(rest.length, REINSERT);
      rest.splice(n, 0, top);
      text = 'Back in ' + n + ' cards';
    }
    const goal = this.props.goal ?? 12;
    const done = s.done + 1;
    const reached = done === goal && !s.goalSeen;
    this.setState({
      stack: rest, revealed: false, dx: 0, anim: false, busy: false, done,
      hist: s.hist.concat([{ stack: s.stack, done: s.done }]).slice(-30),
      note: { text, undo: true, plain: false },
      showGoal: reached, goalSeen: s.goalSeen || reached
    });
  }

  undo() {
    const h = this.state.hist;
    if (!h.length) return;
    const last = h[h.length - 1];
    this.setState({ stack: last.stack, done: last.done, hist: h.slice(0, -1), revealed: true, dx: 0, anim: false, note: { text: 'Undone', undo: false, plain: true } });
  }

  renderVals() {
    const t = (this.props.dark ?? false) ? THEMES.dark : THEMES.light;
    const goal = this.props.goal ?? 12;
    const s = this.state;
    const dx = s.dx;
    const p = Math.min(1, Math.abs(dx) / CARD_W);
    const rot = Math.max(-28, Math.min(28, dx * 0.09));
    const dy = Math.min(140, dx * dx * 0.0005);
    const sc = 1 - 0.14 * p;
    // Ears are hidden at rest, slide in with the drag (fully in at 40%), and swell at the 60% commit point.
    const inL = s.focusL ? 1 : (dx < 0 ? Math.min(1, -dx / (0.4 * CARD_W)) : 0);
    const inR = s.focusR ? 1 : (dx > 0 ? Math.min(1, dx / (0.4 * CARD_W)) : 0);
    const commitL = dx <= -0.6 * CARD_W;
    const commitR = dx >= 0.6 * CARD_W;
    const note = s.note || { text: '', undo: false, plain: false };
    return {
      t, goal,
      done: s.done,
      stackSize: s.stack.length,
      progPct: Math.min(100, Math.round((s.done / goal) * 100)),
      top: CARDS[s.stack[0]],
      next: CARDS[s.stack[1]],
      nextOp: p.toFixed(2),
      revealed: s.revealed,
      hidden: !s.revealed,
      cardTf: 'translate(' + dx.toFixed(1) + 'px, ' + dy.toFixed(1) + 'px) rotate(' + rot.toFixed(2) + 'deg) scale(' + sc.toFixed(3) + ')',
      cardTr: s.anim ? 'transform 240ms cubic-bezier(.2,.8,.2,1)' : 'none',
      earL: 'translateX(' + (-84 * (1 - inL)).toFixed(1) + 'px) scale(' + (commitL ? 1.08 : 1) + ')',
      earR: 'translateX(' + (84 * (1 - inR)).toFixed(1) + 'px) scale(' + (commitR ? 1.08 : 1) + ')',
      earTr: this.dragging ? 'transform 60ms linear' : 'transform 220ms cubic-bezier(.2,.8,.2,1)',
      focusL: () => this.setState({ focusL: true }),
      blurL: () => this.setState({ focusL: false }),
      focusR: () => this.setState({ focusR: true }),
      blurR: () => this.setState({ focusR: false }),
      above: [4, 3, 2, 1].map((k) => ({ top: 160 - 17 * k, bg: 'linear-gradient(to bottom, ' + t.above[k - 1][0] + ' 0px, ' + t.above[k - 1][1] + ' 17px)' })),
      below: [3, 2, 1].map((k) => ({ top: 160 + 17 * k, bg: t.below[k - 1] })),
      hasNote: !!s.note,
      note,
      showGoal: s.showGoal,
      seal: SEAL,
      speakLabel: s.speaking ? 'Playing…' : 'Hear it',
      onDown: (e) => this.handleDown(e),
      onMove: (e) => this.handleMove(e),
      onUp: (e) => this.handleUp(e),
      reveal: () => this.setState({ revealed: true, note: null }),
      again: () => this.commit(false),
      gotIt: () => this.commit(true),
      undo: () => this.undo(),
      keepGoing: () => this.setState({ showGoal: false }),
      speak: (e) => {
        if (e && e.stopPropagation) e.stopPropagation();
        this.setState({ speaking: true });
        setTimeout(() => this.setState({ speaking: false }), 900);
      }
    };
  }
}
</script>
</body>
</html>
