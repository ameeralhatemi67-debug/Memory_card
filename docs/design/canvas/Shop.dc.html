.779 0 0 0 1.779,-1.778 1.779,1.779 0 0 0 -1.779,-1.779 z m 0,0.926 a 0.852,0.852 0 0 1 0.853,0.853 0.852,0.852 0 0 1 -0.853,0.852 0.852,0.852 0 0 1 -0.853,-0.852 0.852,0.852 0 0 1 0.853,-0.853 z"/></g></g></svg></span>

  <div role="tablist" aria-label="Categories" style="margin: 12px 18px 0; display: flex; gap: 8px;">

  <div style="position: absolute; left: 0; right: 0; top: 196px; bottom: 112px; overflow-y: auto; padding: 0 18px 120px; box-sizing: border-box;">
    <div style="display: flex; gap: 10px; align-items: flex-start;">
      <sc-for list="{{columns}}" as="col" hint-placeholder-count="2">

                <span style="display: block;">
                  <span style="display: block; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 20px; line-height: 1.05;">{{d.name}}</span>

      <span style="display: block; margin-top: 6px; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 32px; line-height: 1;">German · A1 Basics</span>
      <span style="display: block; margin-top: 6px; font-size: 15px; font-weight: 600; color: {{t.mutedOnInk}};">120 cards · with pronunciation</span>
    </a>
    <p style="margin: 14px 0 0; font-size: 14px; font-weight: 500; color: {{t.muted}}; text-align: center;">Press and hold a deck for quick actions</p>

      <span style="display: block; width: 44px; height: 44px;"><svg width="100%" height="100%" viewBox="0 0 11.321 11.322" fill="currentColor" aria-hidden="true"><g transform="translate(-3015.3506,-1319.8992)"><g transform="matrix(0.73369523,0,0,0.73369523,2071.0345,1201.7805)"><path d="m 1294.783,160.991 c -0.349,0 -0.699,0.134 -0.966,0.402 l -4.247,4.247 c -0.026,0.02 -0.051,0.042 -0.074,0.066 l -2.181,2.181 c -0.329,0.329 -0.329,0.858 0,1.187 0.329,0.329 0.858,0.329 1.187,0 l 0.076,-0.076 0,-0 2.104,-2.104 3.135,-3.135 c 0.535,-0.535 1.397,-0.535 1.933,-0 l 3.135,3.135 1.951,1.951 0.229,0.229 c 0.329,0.329 0.858,0.329 1.187,0 0.329,-0.329 0.329,-0.858 -0,-1.187 l -2.181,-2.181 c -0.024,-0.024 -0.05,-0.046 -0.076,-0.066 l -4.246,-4.246 c -0.268,-0.268 -0.617,-0.402 -0.966,-0.402 z"/><path d="m 1294.784,164.627 c -0.349,0 -0.699,0.134 -0.966,0.402 l -5.431,5.432 -0.021,0.021 c -0.148,0.153 -0.24,0.361 -0.24,0.591 h 0.001 v 2.893 1.182 c 0,0.707 0.569,1.276 1.276,1.276 h 1.182 2.262 v -3.618 c 0,-0.178 0.143,-0.321 0.321,-0.321 h 3.224 c 0.178,0 0.321,0.143 0.321,0.321 v 3.618 h 2.272 1.18 c 0.707,0 1.276,-0.569 1.276,-1.276 v -1.181 -2.894 h -0.001 c 0,-0.233 -0.093,-0.443 -0.244,-0.597 l -0.01,-0.01 -5.436,-5.436 c -0.268,-0.268 -0.617,-0.402 -0.966,-0.402 z"/></g></g></svg></span>

    <a href="Editor.dc.html" aria-label="Create a card" style="display: flex; position: relative; width: 84px; height: 84px; align-items: center; justify-content: center; color: {{t.canvas}};">

      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true" style="position: relative;"><path d="M12 4.5v15M4.5 12h15"/></svg>

    <a href="Shop.dc.html" aria-label="Shop" aria-current="page" style="display: flex; width: 56px; height: 56px; align-items: center; justify-content: center; color: {{t.ink}};">
      <span style="display: block; width: 48px; height: 42px;"><svg width="100%" height="100%" viewBox="0 0 11.322 9.794" fill="currentColor" aria-hidden="true"><g transform="translate(-3035.2904,-1321.978)"><g transform="matrix(0.52297311,0,0,0.52297311,2612.2188,1252.0369)"><path d="m 812.241,133.738 c -0.992,0 -1.791,0.799 -1.791,1.791 -0.034,0.069 -1.488,2.963 -1.475,4.327 -0.005,1.418 0.607,2.381 1.475,2.877 1.3,0.742 3.178,0.437 4.436,-0.963 1.573,1.755 3.209,1.752 4.907,-0.011 1.524,1.701 3.173,1.704 4.946,0.011 1.023,1.257 3.009,1.581 4.389,0.824 0.866,-0.475 1.494,-1.374 1.494,-2.738 0,-1.193 -1.448,-4.229 -1.494,-4.327 0,-0.086 -0.009,-0.203 -0.021,-0.286 -0.123,-0.871 -0.864,-1.504 -1.769,-1.504 z"/><path d="m 819.793,143.182 c -1.698,1.763 -3.333,1.766 -4.907,0.011 -1.255,1.396 -3.127,1.703 -4.427,0.967 v 6.513 c 0,0.992 0.799,1.79 1.791,1.79 h 4.831 v -5.076 c 0,-0.25 0.201,-0.451 0.451,-0.451 h 4.522 c 0.25,0 0.451,0.201 0.451,0.451 v 5.076 h 4.843 c 0.992,0 1.791,-0.798 1.791,-1.79 v -6.663 c -0.003,0.002 -0.006,0.004 -0.01,0.006 -1.38,0.757 -3.366,0.434 -4.389,-0.824 -1.773,1.693 -3.422,1.689 -4.946,-0.011 z"/></g></g></svg></span>

</div>

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"columns":{"editor":"enum","options":["2","3","4"],"default":"2"},"$preview":{"width":390,"height":844}}'>
const THEMES = {
  light: { canvas: '#F1F1F1', canvasClear: 'rgba(241,241,241,0)', ink: '#333333', onInk: '#F1F1F1', muted: '#666666', mutedOnInk: '#BDBDBD', soft: '#E3E3E3',
           tiles: ['#C4C4C4', '#CDCDCD', '#BBBBBB'], tileText: '#333333', tileMeta: '#555555' },
  dark:  { canvas: '#333333', canvasClear: 'rgba(51,51,51,0)', ink: '#F1F1F1', onInk: '#333333', muted: '#BDBDBD', mutedOnInk: '#666666', soft: '#444444',
           tiles: ['#5A5A5A', '#525252', '#626262'], tileText: '#F1F1F1', tileMeta: '#D0D0D0' }
};
const CAT = { lang: { name: 'Languages', dot: '#80AEFF' }, code: { name: 'Coding', dot: '#FFC680' }, med: { name: 'Medicine', dot: '#D35F5F' } };
const DECKS = [
  { mono: 'De', name: 'German · A1 Basics', cards: 120, cat: 'lang', h: 230, shape: 'top' },
  { mono: 'Es', name: 'Spanish · Basics', cards: 80, cat: 'lang', h: 150, shape: 'rect' },
  { mono: 'Py', name: 'Python · Syntax', cards: 70, cat: 'code', h: 270, shape: 'full' },
  { mono: 'Fr', name: 'French · Essentials', cards: 90, cat: 'lang', h: 170, shape: 'rect' },
  { mono: 'De', name: 'German · A2', cards: 150, cat: 'lang', h: 200, shape: 'bottom' },
  { mono: 'C++', name: 'C++ · Pointers', cards: 45, cat: 'code', h: 160, shape: 'rect' },
  { mono: 'ع', name: 'Arabic · Alphabet', cards: 28, cat: 'lang', h: 240, shape: 'top' },
  { mono: 'Bo', name: 'Anatomy · Bones', cards: 60, cat: 'med', h: 180, shape: 'bottom' },
  { mono: 'Da', name: 'Dart · Basics', cards: 50, cat: 'code', h: 150, shape: 'rect' },
  { mono: 'En', name: 'English · Idioms', cards: 60, cat: 'lang', h: 210, shape: 'full' },
  { mono: 'De', name: 'German · B1', cards: 180, cat: 'lang', h: 170, shape: 'rect' },
  { mono: 'Rx', name: 'Pharmacology · Basics', cards: 75, cat: 'med', h: 230, shape: 'top' }
];
const RADIUS = { top: '999px 999px 18px 18px', bottom: '18px 18px 999px 999px', full: '999px', rect: '18px' };
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'all', query: '' };
  }
  renderVals() {
    const t = (this.props.dark ?? false) ? THEMES.dark : THEMES.light;
    const n = parseInt(this.props.columns ?? '2', 10) || 2;
    const q = this.state.query.trim().toLowerCase();
    const list = DECKS.filter((d) => (this.state.cat === 'all' || d.cat === this.state.cat) && (!q || d.name.toLowerCase().includes(q)));
    const scale = n === 2 ? 1 : n === 3 ? 0.8 : 0.66;
    const cols = Array.from({ length: n }, () => ({ tiles: [], h: 0 }));
    list.forEach((d, i) => {
      const c = cols.reduce((a, b) => (b.h < a.h ? b : a));
      const h = Math.round(d.h * scale);
      c.tiles.push({
        mono: d.mono, name: d.name, meta: d.cards + ' cards', h,
        aria: d.name + ', ' + d.cards + ' cards',
        radius: RADIUS[d.shape], bg: t.tiles[i % 3], dot: CAT[d.cat].dot
      });
      c.h += h + 10;
    });
    const cats = [['all', 'All', t.ink]].concat(Object.keys(CAT).map((k) => [k, CAT[k].name, CAT[k].dot])).map(([id, name, dot]) => {
      const on = this.state.cat === id;
      return { name, dot, on, bg: on ? t.ink : t.soft, fg: on ? t.canvas : t.ink, pick: () => this.setState({ cat: id }) };
    });
    return {
      t, cats,
      columns: cols,
      showNames: n <= 3,
      mono: n === 2 ? 56 : n === 3 ? 40 : 28,
      query: this.state.query,
      onQuery: (e) => this.setState({ query: e.target.value })
    };
  }
}
</script>
