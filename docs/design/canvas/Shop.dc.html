<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Shop</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,700..900&amp;family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
@keyframes mcBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes mcPop{from{transform:scale(0.4);opacity:0}to{transform:scale(1);opacity:1}}
</style>
</helmet>
<div data-shop-root="1" style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.canvas}}; color: {{t.ink}}; font-family: 'Barlow Semi Condensed', system-ui, sans-serif;">

  <header style="height: 76px; box-sizing: border-box; padding: 18px 16px 0 18px; display: flex; align-items: center; gap: 12px;">
    <a href="Drawer.dc.html" aria-label="Open folders" style="display: flex; width: 44px; height: 44px; align-items: center; justify-content: center; color: {{t.ink}};">
      <span style="display: block; width: 28px; height: 36px;"><svg width="100%" height="100%" viewBox="0 0 11.211 14.182" fill="currentColor" aria-hidden="true"><g transform="translate(-3014.7719,-1275.9218)"><g transform="translate(-69.860379)"><rect x="3084.633" y="1275.922" width="6.926" height="11.206" ry="0.534" fill-opacity=".55"/><rect x="3312.468" y="433.451" width="6.926" height="11.206" ry="0.534" transform="rotate(15)" fill-opacity=".78"/><rect x="3314.619" y="-438.992" width="6.926" height="11.206" ry="0.534" transform="rotate(30)"/></g></g></svg></span>
    </a>
    <div style="flex: 1; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 26px;">Shop</div>
    <button aria-label="Menu" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <span style="display: block; width: 8px; height: 26px;"><svg width="100%" height="100%" viewBox="0 0 2.444 8.911" fill="currentColor" aria-hidden="true"><g transform="translate(-2998.7693,-1277.1094)"><g transform="translate(-455.15531,250.69204)"><circle cx="3455.146" cy="1034.107" r="1.222"/><circle cx="3455.146" cy="1030.873" r="1.222"/><circle cx="3455.146" cy="1027.639" r="1.222"/></g></g></svg></span>
    </button>
  </header>

  <div style="position: absolute; left: 18px; right: 18px; top: 86px; display: flex; gap: 10px;">
    <label style="flex: 1; position: relative; display: block;">
      <span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0);">Search decks</span>
      <span aria-hidden="true" style="position: absolute; left: 14px; top: 13px; width: 24px; height: 24px; color: {{t.muted}};"><svg width="100%" height="100%" viewBox="0 0 9.34 9.339" fill="currentColor"><g transform="translate(-2951.3477,-1323.9333)"><g transform="translate(2465.6093,1035.8454)"><path d="m 489.632,288.088 a 3.893,3.893 0 0 0 -3.893,3.893 3.893,3.893 0 0 0 3.893,3.893 3.893,3.893 0 0 0 1.845,-0.465 l 1.69,1.69 c 0.439,0.439 1.145,0.439 1.584,0 0.439,-0.439 0.439,-1.145 0,-1.584 l -1.69,-1.69 a 3.893,3.893 0 0 0 0.465,-1.845 3.893,3.893 0 0 0 -3.893,-3.893 z m 0,1.002 a 2.891,2.891 0 0 1 2.891,2.891 2.891,2.891 0 0 1 -0.215,1.092 l -0.004,-0.004 a 2.891,2.891 0 0 1 -1.584,1.584 l 0.004,0.004 a 2.891,2.891 0 0 1 -1.092,0.216 2.891,2.891 0 0 1 -2.891,-2.891 2.891,2.891 0 0 1 2.891,-2.891 z m -1.922,2.681 a 0.367,0.367 0 0 0 -0.391,0.34 c -0.04,0.595 0.181,1.181 0.605,1.601 0.424,0.42 1.01,0.635 1.605,0.59 a 0.367,0.367 0 0 0 0.338,-0.393 0.367,0.367 0 0 0 -0.395,-0.338 c -0.383,0.029 -0.759,-0.109 -1.032,-0.38 -0.273,-0.271 -0.414,-0.647 -0.388,-1.031 a 0.367,0.367 0 0 0 -0.341,-0.389 z"/></g></g></svg></span>
      <input value="{{query}}" onChange="{{onQuery}}" placeholder="Search decks" style="width: 100%; height: 50px; box-sizing: border-box; padding: 0 14px 0 46px; border: 0; border-radius: 14px; background: {{t.soft}}; color: {{t.ink}}; font-family: inherit; font-size: 18px; font-weight: 600;">
    </label>
    <button aria-label="Filters" style="width: 50px; height: 50px; border: 0; border-radius: 14px; background: {{t.ink}}; color: {{t.canvas}}; display: flex; align-items: center; justify-content: center; cursor: pointer;">
      <span style="display: block; width: 24px; height: 24px;"><svg width="100%" height="100%" viewBox="0 0 8.945 8.642" fill="currentColor" aria-hidden="true"><g transform="translate(-2973.7149,-1324.1336)"><g transform="matrix(0.77615351,0,0,0.77615351,2696.4867,1410.2158)"><path d="m 360.629,-107.12 a 1.779,1.779 0 0 0 -1.778,1.778 1.779,1.779 0 0 0 1.778,1.779 1.779,1.779 0 0 0 1.779,-1.779 1.779,1.779 0 0 0 -1.779,-1.778 z m 0,0.926 a 0.852,0.852 0 0 1 0.853,0.852 0.852,0.852 0 0 1 -0.853,0.853 0.852,0.852 0 0 1 -0.852,-0.853 0.852,0.852 0 0 1 0.852,-0.852 z"/><path d="m 357.948,-109.94 c -0.424,0 -0.766,0.341 -0.766,0.765 v 0.089 c 0,0.424 0.342,0.765 0.766,0.765 h 5.775 a 0.852,0.852 0 0 1 -0.59,-0.81 0.852,0.852 0 0 1 0.591,-0.81 z m 6.303,0 a 0.852,0.852 0 0 1 0.587,0.81 0.852,0.852 0 0 1 -0.59,0.81 h 3.693 c 0.424,0 0.765,-0.341 0.765,-0.765 v -0.089 c 0,-0.424 -0.341,-0.765 -0.765,-0.765 z"/><path d="m 357.948,-106.151 c -0.424,0 -0.766,0.342 -0.766,0.766 v 0.088 c 0,0.424 0.342,0.765 0.766,0.765 h 2.419 a 0.852,0.852 0 0 1 -0.59,-0.81 0.852,0.852 0 0 1 0.592,-0.81 z m 2.946,0 a 0.852,0.852 0 0 1 0.588,0.81 0.852,0.852 0 0 1 -0.59,0.81 h 7.05 c 0.424,0 0.765,-0.341 0.765,-0.765 v -0.088 c 0,-0.424 -0.341,-0.766 -0.765,-0.766 z"/><path d="m 357.948,-102.363 c -0.424,0 -0.766,0.341 -0.766,0.765 v 0.088 c 0,0.424 0.342,0.766 0.766,0.766 h 7.237 a 0.852,0.852 0 0 1 -0.592,-0.81 0.852,0.852 0 0 1 0.59,-0.81 z m 7.765,0 a 0.852,0.852 0 0 1 0.586,0.81 0.852,0.852 0 0 1 -0.592,0.81 h 2.234 c 0.424,0 0.765,-0.342 0.765,-0.766 v -0.088 c 0,-0.424 -0.341,-0.765 -0.765,-0.765 z"/><path d="m 363.985,-110.909 a 1.779,1.779 0 0 0 -1.779,1.779 1.779,1.779 0 0 0 1.779,1.779 1.779,1.779 0 0 0 1.779,-1.779 1.779,1.779 0 0 0 -1.779,-1.779 z m 0,0.926 a 0.852,0.852 0 0 1 0.853,0.853 0.852,0.852 0 0 1 -0.853,0.853 0.852,0.852 0 0 1 -0.853,-0.853 0.852,0.852 0 0 1 0.853,-0.853 z"/><path d="m 365.446,-103.331 a 1.779,1.779 0 0 0 -1.779,1.779 1.779,1.779 0 0 0 1.779,1.778 1.779,1.779 0 0 0 1.779,-1.778 1.779,1.779 0 0 0 -1.779,-1.779 z m 0,0.926 a 0.852,0.852 0 0 1 0.853,0.853 0.852,0.852 0 0 1 -0.853,0.852 0.852,0.852 0 0 1 -0.853,-0.852 0.852,0.852 0 0 1 0.853,-0.853 z"/></g></g></svg></span>
    </button>
  </div>

  <div role="tablist" aria-label="Categories" style="position: absolute; left: 18px; right: 18px; top: 148px; display: flex; gap: 8px;">
    <sc-for list="{{cats}}" as="c" hint-placeholder-count="4">
      <button role="tab" aria-selected="{{c.on}}" onClick="{{c.pick}}" style="height: 34px; padding: 0 14px; border: 0; border-radius: 17px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; display: flex; align-items: center; gap: 7px; background: {{c.bg}}; color: {{c.fg}};">
        <span aria-hidden="true" style="width: 8px; height: 8px; border-radius: 4px; background: {{c.dot}};"></span>{{c.name}}
      </button>
    </sc-for>
  </div>

  <div style="position: absolute; left: 0; right: 0; top: 196px; bottom: 112px; overflow-y: auto; scrollbar-width: none; -ms-overflow-style: none; padding: 6px 18px 140px; box-sizing: border-box;">
    <sc-if value="{{showHero}}" hint-placeholder-val="{{true}}">
      <a href="Preview.dc.html" style="position: relative; display: block; height: 160px; border-radius: 22px; background: {{t.ink}}; color: {{t.onInk}}; text-decoration: none; overflow: hidden;">
        <div style="position: absolute; left: 18px; top: 18px; width: 180px;">
          <div style="font-size: 12px; font-weight: 700; letter-spacing: 1.4px; text-transform: uppercase; color: {{t.mutedOnInk}};">Start here</div>
          <div style="margin-top: 6px; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 32px; line-height: 1;">German · A1 Basics</div>
          <div style="margin-top: 6px; font-size: 14px; font-weight: 600; color: {{t.mutedOnInk}};">120 cards · with audio</div>
          <span style="margin-top: 12px; display: inline-flex; align-items: center; height: 32px; padding: 0 14px; border-radius: 16px; background: {{t.canvas}}; color: {{t.ink}}; font-size: 14px; font-weight: 700;">Preview</span>
        </div>
        <span aria-hidden="true" style="position: absolute; right: 30px; top: 26px; width: 92px; height: 116px; border-radius: 14px; background: {{t.heroBack2}}; transform: rotate(-12deg);"></span>
        <span aria-hidden="true" style="position: absolute; right: 22px; top: 22px; width: 92px; height: 116px; border-radius: 14px; background: {{t.heroBack1}}; transform: rotate(7deg);"></span>
        <span aria-hidden="true" style="position: absolute; right: 30px; top: 18px; width: 30px; height: 12px; border-radius: 5px; background: #80AEFF;"></span>
        <span aria-hidden="true" style="position: absolute; right: 24px; top: 24px; width: 92px; height: 116px; border-radius: 14px; background: {{t.canvas}}; color: {{t.ink}}; display: flex; align-items: center; justify-content: center; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 46px;">De</span>
      </a>
    </sc-if>

    <sc-for list="{{sections}}" as="sec" hint-placeholder-count="3">
      <section aria-label="{{sec.name}}" style="margin-top: 18px;">
        <div style="display: flex; align-items: baseline; justify-content: space-between; height: 26px;">
          <h2 style="margin: 0; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 25px; line-height: 26px;">{{sec.name}}</h2>
          <span style="font-size: 13px; font-weight: 600; color: {{t.muted}};">{{sec.count}}</span>
        </div>
        <div style="margin-top: 10px; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px;">
          <sc-for list="{{sec.decks}}" as="d" hint-placeholder-count="4">
            <a href="Preview.dc.html" aria-label="{{d.aria}}" onPointerDown="{{d.down}}" onPointerMove="{{onMove}}" onPointerUp="{{cancelHold}}" onPointerLeave="{{cancelHold}}" onPointerCancel="{{cancelHold}}" onClick="{{onTileClick}}" onContextMenu="{{noMenu}}" style="display: block; position: relative; height: 206px; box-sizing: border-box; padding: 12px; border-radius: 18px; background: {{t.soft}}; color: {{t.ink}}; text-decoration: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; touch-action: pan-y;">
              <span aria-hidden="true" style="position: relative; display: block; height: 120px;">
                <span style="position: absolute; left: 26px; top: 14px; width: 94px; height: 100px; border-radius: 12px; background: {{t.back2}}; transform: rotate(-8deg);"></span>
                <span style="position: absolute; left: 30px; top: 10px; width: 94px; height: 100px; border-radius: 12px; background: {{t.back1}}; transform: rotate(6deg);"></span>
                <span style="position: absolute; left: 37px; top: 1px; width: 30px; height: 12px; border-radius: 5px; background: {{d.dot}};"></span>
                <span style="position: absolute; left: 27px; top: 8px; width: 94px; height: 104px; border-radius: 12px; background: {{t.ink}}; color: {{t.onInk}}; display: flex; align-items: center; justify-content: center; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 40px;">{{d.mono}}</span>
              </span>
              <span style="display: block; margin-top: 8px; height: 40px; overflow: hidden; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 19px; line-height: 20px;">{{d.name}}</span>
              <span style="display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: {{t.muted}};">{{d.meta}}</span>
            </a>
          </sc-for>
        </div>
      </section>
    </sc-for>

    <sc-if value="{{empty}}" hint-placeholder-val="{{false}}">
      <p style="margin: 40px 0 0; text-align: center; font-size: 17px; font-weight: 600; color: {{t.muted}};">No decks match “{{query}}”.</p>
    </sc-if>
    <p style="margin: 20px 0 0; font-size: 14px; font-weight: 500; color: {{t.muted}}; text-align: center;">Press and hold a deck for quick actions</p>
  </div>

  <div aria-hidden="true" style="position: absolute; left: 0; right: 0; bottom: 112px; height: 70px; background: linear-gradient(to bottom, {{t.canvasClear}}, {{t.canvas}}); pointer-events: none;"></div>

  <nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 112px; display: flex; align-items: center; justify-content: space-around; padding: 0 22px 10px; box-sizing: border-box; background: {{t.canvas}};">
    <a href="Main.dc.html" aria-label="Home" style="display: flex; width: 56px; height: 56px; align-items: center; justify-content: center; color: {{t.ink}};">
      <span style="display: block; width: 44px; height: 44px;"><svg width="100%" height="100%" viewBox="0 0 11.321 11.322" fill="currentColor" aria-hidden="true"><g transform="translate(-3015.3506,-1319.8992)"><g transform="matrix(0.73369523,0,0,0.73369523,2071.0345,1201.7805)"><path d="m 1294.783,160.991 c -0.349,0 -0.699,0.134 -0.966,0.402 l -4.247,4.247 c -0.026,0.02 -0.051,0.042 -0.074,0.066 l -2.181,2.181 c -0.329,0.329 -0.329,0.858 0,1.187 0.329,0.329 0.858,0.329 1.187,0 l 0.076,-0.076 0,-0 2.104,-2.104 3.135,-3.135 c 0.535,-0.535 1.397,-0.535 1.933,-0 l 3.135,3.135 1.951,1.951 0.229,0.229 c 0.329,0.329 0.858,0.329 1.187,0 0.329,-0.329 0.329,-0.858 -0,-1.187 l -2.181,-2.181 c -0.024,-0.024 -0.05,-0.046 -0.076,-0.066 l -4.246,-4.246 c -0.268,-0.268 -0.617,-0.402 -0.966,-0.402 z"/><path d="m 1294.784,164.627 c -0.349,0 -0.699,0.134 -0.966,0.402 l -5.431,5.432 -0.021,0.021 c -0.148,0.153 -0.24,0.361 -0.24,0.591 h 0.001 v 2.893 1.182 c 0,0.707 0.569,1.276 1.276,1.276 h 1.182 2.262 v -3.618 c 0,-0.178 0.143,-0.321 0.321,-0.321 h 3.224 c 0.178,0 0.321,0.143 0.321,0.321 v 3.618 h 2.272 1.18 c 0.707,0 1.276,-0.569 1.276,-1.276 v -1.181 -2.894 h -0.001 c 0,-0.233 -0.093,-0.443 -0.244,-0.597 l -0.01,-0.01 -5.436,-5.436 c -0.268,-0.268 -0.617,-0.402 -0.966,-0.402 z"/></g></g></svg></span>
    </a>
    <a href="Editor.dc.html" aria-label="Create a card" style="display: flex; position: relative; width: 84px; height: 84px; align-items: center; justify-content: center; color: {{t.canvas}};">
      <span style="position: absolute; left: 13px; top: 13px; width: 58px; height: 58px; border-radius: 15px; background: {{t.ink}}; transform: rotate(45deg);"></span>
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" aria-hidden="true" style="position: relative;"><path d="M12 4.5v15M4.5 12h15"/></svg>
    </a>
    <a href="Shop.dc.html" aria-label="Shop" aria-current="page" style="display: flex; width: 56px; height: 56px; align-items: center; justify-content: center; color: {{t.ink}};">
      <span style="display: block; width: 48px; height: 42px;"><svg width="100%" height="100%" viewBox="0 0 11.322 9.794" fill="currentColor" aria-hidden="true"><g transform="translate(-3035.2904,-1321.978)"><g transform="matrix(0.52297311,0,0,0.52297311,2612.2188,1252.0369)"><path d="m 812.241,133.738 c -0.992,0 -1.791,0.799 -1.791,1.791 -0.034,0.069 -1.488,2.963 -1.475,4.327 -0.005,1.418 0.607,2.381 1.475,2.877 1.3,0.742 3.178,0.437 4.436,-0.963 1.573,1.755 3.209,1.752 4.907,-0.011 1.524,1.701 3.173,1.704 4.946,0.011 1.023,1.257 3.009,1.581 4.389,0.824 0.866,-0.475 1.494,-1.374 1.494,-2.738 0,-1.193 -1.448,-4.229 -1.494,-4.327 0,-0.086 -0.009,-0.203 -0.021,-0.286 -0.123,-0.871 -0.864,-1.504 -1.769,-1.504 z"/><path d="m 819.793,143.182 c -1.698,1.763 -3.333,1.766 -4.907,0.011 -1.255,1.396 -3.127,1.703 -4.427,0.967 v 6.513 c 0,0.992 0.799,1.79 1.791,1.79 h 4.831 v -5.076 c 0,-0.25 0.201,-0.451 0.451,-0.451 h 4.522 c 0.25,0 0.451,0.201 0.451,0.451 v 5.076 h 4.843 c 0.992,0 1.791,-0.798 1.791,-1.79 v -6.663 c -0.003,0.002 -0.006,0.004 -0.01,0.006 -1.38,0.757 -3.366,0.434 -4.389,-0.824 -1.773,1.693 -3.422,1.689 -4.946,-0.011 z"/></g></g></svg></span>
    </a>
  </nav>

  <sc-if value="{{holding}}" hint-placeholder-val="{{false}}">
    <div role="dialog" aria-modal="true" aria-label="{{hold.aria}}" style="position: absolute; inset: 0;">
      <button onClick="{{closeHold}}" aria-label="Close quick actions" style="position: absolute; inset: 0; border: 0; padding: 0; background: rgba(15,15,15,0.66); cursor: default;"></button>
      <div aria-hidden="true" style="position: absolute; box-sizing: border-box; padding: 12px; border-radius: 18px; background: {{t.holdTile}}; color: #333333; box-shadow: 0 18px 44px rgba(0,0,0,0.4); transform: scale(1.05); left: {{hold.x}}px; top: {{hold.y}}px; width: {{hold.w}}px; height: {{hold.h}}px;">
        <span style="position: relative; display: block; height: 120px;">
          <span style="position: absolute; left: 26px; top: 14px; width: 94px; height: 100px; border-radius: 12px; background: #9D9D9D; transform: rotate(-8deg);"></span>
          <span style="position: absolute; left: 30px; top: 10px; width: 94px; height: 100px; border-radius: 12px; background: #747474; transform: rotate(6deg);"></span>
          <span style="position: absolute; left: 37px; top: 1px; width: 30px; height: 12px; border-radius: 5px; background: {{hold.dot}};"></span>
          <span style="position: absolute; left: 27px; top: 8px; width: 94px; height: 104px; border-radius: 12px; background: #333333; color: #F1F1F1; display: flex; align-items: center; justify-content: center; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 40px;">{{hold.mono}}</span>
        </span>
        <span style="display: block; margin-top: 8px; height: 40px; overflow: hidden; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 19px; line-height: 20px;">{{hold.name}}</span>
        <span style="display: block; margin-top: 2px; font-size: 13px; font-weight: 600; color: #555555;">{{hold.meta}}</span>
      </div>
      <sc-for list="{{badges}}" as="b" hint-placeholder-count="4">
        <button onClick="{{b.act}}" aria-label="{{b.label}}" style="position: absolute; width: 76px; height: 98px; border: 0; padding: 0; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 4px; left: {{b.x}}px; top: {{b.y}}px; animation: mcPop 220ms cubic-bezier(.2,1.4,.4,1) both; animation-delay: {{b.delay}}ms;">
          <span style="position: relative; display: block; width: 72px; height: 72px; animation: mcBob 2.6s ease-in-out infinite; animation-delay: {{b.bob}}ms;">
            <svg width="72" height="72" viewBox="-40 -40 80 80" aria-hidden="true" style="position: absolute; inset: 0; transform: rotate({{b.tilt}}deg);"><path d="{{b.path}}" fill="#F1F1F1" stroke="#F1F1F1" stroke-width="3" stroke-linejoin="round"/></svg>
            <span style="position: absolute; left: 22px; top: 22px; width: 28px; height: 28px; color: #333333;">

              <sc-if value="{{b.isSearch}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="0 0 9.34 9.339" fill="currentColor" aria-hidden="true"><g transform="translate(-2951.3477,-1323.9333)"><g transform="translate(2465.6093,1035.8454)"><path d="m 489.632,288.088 a 3.893,3.893 0 0 0 -3.893,3.893 3.893,3.893 0 0 0 3.893,3.893 3.893,3.893 0 0 0 1.845,-0.465 l 1.69,1.69 c 0.439,0.439 1.145,0.439 1.584,0 0.439,-0.439 0.439,-1.145 0,-1.584 l -1.69,-1.69 a 3.893,3.893 0 0 0 0.465,-1.845 3.893,3.893 0 0 0 -3.893,-3.893 z m 0,1.002 a 2.891,2.891 0 0 1 2.891,2.891 2.891,2.891 0 0 1 -0.215,1.092 l -0.004,-0.004 a 2.891,2.891 0 0 1 -1.584,1.584 l 0.004,0.004 a 2.891,2.891 0 0 1 -1.092,0.216 2.891,2.891 0 0 1 -2.891,-2.891 2.891,2.891 0 0 1 2.891,-2.891 z m -1.922,2.681 a 0.367,0.367 0 0 0 -0.391,0.34 c -0.04,0.595 0.181,1.181 0.605,1.601 0.424,0.42 1.01,0.635 1.605,0.59 a 0.367,0.367 0 0 0 0.338,-0.393 0.367,0.367 0 0 0 -0.395,-0.338 c -0.383,0.029 -0.759,-0.109 -1.032,-0.38 -0.273,-0.271 -0.414,-0.647 -0.388,-1.031 a 0.367,0.367 0 0 0 -0.341,-0.389 z"/></g></g></svg></sc-if>
              <sc-if value="{{b.isSave}}" hint-placeholder-val="{{false}}"><svg width="100%" height="100%" viewBox="0 0 6.702 9.335" fill="currentColor" aria-hidden="true"><g transform="translate(-2998.2159,-1359.6182)"><path d="m 2998.815,1359.618 c -0.332,0 -0.598,0.267 -0.598,0.598 v 8.551 c 0,0.065 0.098,0.19 0.282,0.185 0.185,0.01 1.089,-0.742 1.598,-1.624 0.43,-0.745 0.057,-1.622 1.471,-1.622 1.266,0 1.129,1.029 1.471,1.622 0.509,0.882 1.342,1.629 1.61,1.624 0.238,0.01 0.269,-0.12 0.27,-0.185 v -8.551 c 0,-0.331 -0.266,-0.598 -0.598,-0.598 z"/></g></svg></sc-if>

  <sc-if value="{{hasToast}}" hint-placeholder-val="{{false}}">
    <div role="status" style="position: absolute; left: 50%; bottom: 126px; transform: translateX(-50%); height: 40px; padding: 0 16px; border-radius: 20px; background: {{t.ink}}; color: {{t.canvas}}; display: flex; align-items: center; font-size: 15px; font-weight: 700; white-space: nowrap;">{{toast}}</div>

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"demoHold":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const THEMES = {
  light: { canvas: '#F1F1F1', canvasClear: 'rgba(241,241,241,0)', ink: '#333333', onInk: '#F1F1F1', muted: '#666666', mutedOnInk: '#BDBDBD', soft: '#E4E4E4',
           back1: '#9D9D9D', back2: '#C4C4C4', heroBack1: '#747474', heroBack2: '#5A5A5A', holdTile: '#E4E4E4' },
  dark:  { canvas: '#333333', canvasClear: 'rgba(51,51,51,0)', ink: '#F1F1F1', onInk: '#333333', muted: '#BDBDBD', mutedOnInk: '#666666', soft: '#424242',
           back1: '#8A8A8A', back2: '#5E5E5E', heroBack1: '#BDBDBD', heroBack2: '#9D9D9D', holdTile: '#E4E4E4' }
};
const CATS = [
  { id: 'lang', name: 'Languages', dot: '#80AEFF' },
  { id: 'code', name: 'Coding', dot: '#FFC680' },
  { id: 'med', name: 'Medicine', dot: '#D35F5F' }
];
const DECKS = [
  { mono: 'De', name: 'German · A1 Basics', cards: 120, cat: 'lang', extra: 'A1' },
  { mono: 'De', name: 'German · A2', cards: 150, cat: 'lang', extra: 'A2' },
  { mono: 'De', name: 'German · B1', cards: 180, cat: 'lang', extra: 'B1' },
  { mono: 'Es', name: 'Spanish · Basics', cards: 80, cat: 'lang', extra: 'A1' },
  { mono: 'Fr', name: 'French · Essentials', cards: 90, cat: 'lang', extra: 'A1' },
  { mono: 'ع', name: 'Arabic · Alphabet', cards: 28, cat: 'lang', extra: 'script' },
  { mono: 'En', name: 'English · Idioms', cards: 60, cat: 'lang', extra: 'B2' },
  { mono: 'Py', name: 'Python · Syntax', cards: 70, cat: 'code', extra: 'basics' },
  { mono: 'Da', name: 'Dart · Basics', cards: 50, cat: 'code', extra: 'basics' },
  { mono: 'C++', name: 'C++ · Pointers', cards: 45, cat: 'code', extra: 'core' },
  { mono: 'Bo', name: 'Anatomy · Bones', cards: 60, cat: 'med', extra: 'skeleton' },
  { mono: 'Rx', name: 'Pharmacology · Basics', cards: 75, cat: 'med', extra: 'drug classes' }
];
function polar(fn, n) {
  let d = '';
  for (let i = 0; i <= n; i++) {
    const a = (i / n) * Math.PI * 2;
    const r = fn(a);
    d += (i === 0 ? 'M' : 'L') + (Math.cos(a) * r).toFixed(2) + ' ' + (Math.sin(a) * r).toFixed(2);
  }
  return d + 'Z';
}
const SHAPES = {
  squircle: polar((a) => 31 * Math.pow(Math.pow(Math.abs(Math.cos(a)), 4) + Math.pow(Math.abs(Math.sin(a)), 4), -0.25) + 2.2 * Math.sin(4 * a + 0.8), 96),
  scallop: polar((a) => 31 + 3.2 * Math.cos(8 * a), 96),
  burst: polar((a) => 29 + 5 * Math.cos(12 * a), 120),
  blob: polar((a) => 31 + 3.5 * Math.sin(3 * a) + 2 * Math.cos(5 * a + 1), 96)
};
const ACTIONS = [
  { label: 'Pin to favourites', short: 'Pin', shape: 'scallop', tilt: 8, isPin: true, toast: 'Pinned to favourites' },
  { label: 'Share deck', short: 'Share', shape: 'squircle', tilt: -6, isShare: true, toast: 'Share link copied' },
  { label: 'Find similar decks', short: 'Similar', shape: 'burst', tilt: 0, isSearch: true, toast: 'Showing similar decks' },
  { label: 'Save to a folder', short: 'Save', shape: 'blob', tilt: -10, isSave: true, toast: 'Saved to German' }
];
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
// Actions arc around the held deck and open toward the roomier side of the screen, never past its edges.
function badgeSpots(h) {
  const cx = h.x + h.w / 2;
  const cy = h.y + h.h / 2;
  const toRight = cx < 195;
  const angles = toRight ? [-55, -20, 15, 50] : [235, 200, 165, 130];
  const rx = h.w / 2 + 52;
  const ry = h.h / 2 + 44;
  return angles.map((a) => {
    const r = (a * Math.PI) / 180;
    return { x: Math.round(clamp(cx + Math.cos(r) * rx - 38, 6, 390 - 82)), y: Math.round(clamp(cy + Math.sin(r) * ry - 36, 80, 844 - 112 - 98)) };
  });
}
// Where "German · A2" sits before any scrolling: first row, right column of the Languages grid.
const DEMO_HOLD = { index: 1, x: 201, y: 416, w: 171, h: 206 };

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { cat: 'all', query: '', hold: null, toast: '' };
    this.timer = null;
    this.held = false;
    this.start = null;
  }
  componentDidMount() {
    if (this.props.demoHold) this.setState({ hold: Object.assign({}, DEMO_HOLD) });
  }
  componentWillUnmount() {
    clearTimeout(this.timer);
    clearTimeout(this.toastTimer);
  }
  pressStart(e, index) {
    clearTimeout(this.timer);
    this.held = false;
    this.start = { x: e.clientX, y: e.clientY };
    const el = e.currentTarget;
    this.timer = setTimeout(() => {
      const root = el.closest('[data-shop-root]');
      if (!root) return;
      const r = el.getBoundingClientRect();
      const rr = root.getBoundingClientRect();
      const k = rr.width / 390 || 1;
      this.held = true;
      this.setState({ hold: { index, x: (r.left - rr.left) / k, y: (r.top - rr.top) / k, w: r.width / k, h: r.height / k } });
    }, 430);
  }
  showToast(text) {
    clearTimeout(this.toastTimer);
    this.setState({ toast: text, hold: null });
    this.toastTimer = setTimeout(() => this.setState({ toast: '' }), 1700);
  }
  renderVals() {
    const t = (this.props.dark ?? false) ? THEMES.dark : THEMES.light;
    const q = this.state.query.trim().toLowerCase();
    const card = (d, i) => ({
      mono: d.mono, name: d.name, meta: d.cards + ' cards · ' + d.extra,
      dot: CATS.find((c) => c.id === d.cat).dot,
      aria: d.name + ', ' + d.cards + ' cards. Press and hold for quick actions',
      down: (e) => this.pressStart(e, i)
    });
    const sections = CATS
      .filter((c) => this.state.cat === 'all' || this.state.cat === c.id)
      .map((c) => {
        const decks = DECKS.map((d, i) => [d, i]).filter(([d]) => d.cat === c.id && (!q || d.name.toLowerCase().includes(q))).map(([d, i]) => card(d, i));
        return { name: c.name, count: decks.length + (decks.length === 1 ? ' deck' : ' decks'), decks };
      })
      .filter((s) => s.decks.length);
    const cats = [{ id: 'all', name: 'All', dot: t.ink }].concat(CATS).map((c) => {
      const on = this.state.cat === c.id;
      return { name: c.name, dot: on && c.id === 'all' ? t.canvas : c.dot, on, bg: on ? t.ink : t.soft, fg: on ? t.canvas : t.ink, pick: () => this.setState({ cat: c.id }) };
    });
    const h = this.state.hold;
    const hold = h ? Object.assign(card(DECKS[h.index], h.index), { x: Math.round(h.x), y: Math.round(h.y), w: Math.round(h.w), h: Math.round(h.h), aria: 'Quick actions for ' + DECKS[h.index].name }) : null;
    const spots = h ? badgeSpots(h) : [];
    const badges = ACTIONS.map((a, i) => Object.assign({ isShare: false, isPin: false, isSearch: false, isSave: false }, a, {
      path: SHAPES[a.shape], x: spots[i] ? spots[i].x : 0, y: spots[i] ? spots[i].y : 0,
      delay: i * 45, bob: i * 330,
      act: () => this.showToast(a.toast)
    }));
    return {
      t, cats, sections,
      showHero: this.state.cat === 'all' && !q,
      empty: sections.length === 0,
      query: this.state.query,
      onQuery: (e) => this.setState({ query: e.target.value }),
      onMove: (e) => {
        if (this.start && Math.hypot(e.clientX - this.start.x, e.clientY - this.start.y) > 8) clearTimeout(this.timer);
      },
      cancelHold: () => clearTimeout(this.timer),
      onTileClick: (e) => { if (this.held) { e.preventDefault(); this.held = false; } },
      noMenu: (e) => e.preventDefault(),
      holding: !!hold,
      hold: hold || { x: 0, y: 0, w: 0, h: 0, mono: '', name: '', meta: '', dot: 'transparent', aria: '' },
      badges,
      closeHold: () => this.setState({ hold: null }),
      hasToast: !!this.state.toast,
      toast: this.state.toast
    };
  }
}
</script>
