<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"demoStates":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const THEMES = {
  light: { canvas: '#F1F1F1', canvasClear: 'rgba(241,241,241,0)', ink: '#333333', onInk: '#F1F1F1', muted: '#666666', mutedOnInk: '#BDBDBD', soft: '#E3E3E3',
           fanOn: ['#8F8F8F', '#A8A8A8', '#C2C2C2', '#DADADA', '#F1F1F1'], fanOff: '#454545',
           e1: '0 1px 2px rgba(0,0,0,0.12), 0 5px 12px rgba(0,0,0,0.12)', e2: '0 2px 4px rgba(0,0,0,0.12), 0 10px 24px rgba(0,0,0,0.2)' },
  dark:  { canvas: '#333333', canvasClear: 'rgba(51,51,51,0)', ink: '#F1F1F1', onInk: '#333333', muted: '#BDBDBD', mutedOnInk: '#666666', soft: '#424242',
           fanOn: ['#A3A3A3', '#888888', '#6E6E6E', '#525252', '#333333'], fanOff: '#DADADA',
           e1: '0 1px 2px rgba(0,0,0,0.45), 0 5px 12px rgba(0,0,0,0.4)', e2: '0 2px 6px rgba(0,0,0,0.5), 0 12px 28px rgba(0,0,0,0.55)' }
};
// "Deck swipe actions" artboard: decks held open at each detent of text_Mockup §3.
const DEMO_OPEN = { d3: -65, d4: -125, d5: 65, d6: 125 };
const START_DECKS = [
  { id: 'd1', name: 'Spanish · Basics', cards: 45, due: 12, mastered: 3, pinned: false },
  { id: 'd2', name: 'Spanish · Verbs', cards: 60, due: 18, mastered: 2, pinned: false },
  { id: 'd3', name: 'French · Essentials', cards: 50, due: 9, mastered: 4, pinned: false },
  { id: 'd4', name: 'French · Food', cards: 36, due: 0, mastered: 5, pinned: false },
  { id: 'd5', name: 'Arabic · Alphabet', cards: 28, due: 7, mastered: 1, pinned: false },
  { id: 'd6', name: 'Arabic · Greetings', cards: 30, due: 15, mastered: 0, pinned: false },
  { id: 'd7', name: 'English · Idioms', cards: 40, due: 0, mastered: 2, pinned: false }
];
// Stepped swipe detents (text_Mockup §3, RES-02/RES-03): option 1 at 65px, option 2 at 125px.
const STEP_1 = 65;
const STEP_2 = 125;
const SPAN_2 = STEP_2 - STEP_1;
const GAP = 10;
const MARGIN = 20;   // the deck bar's side margin; action tiles sit flush to the screen edge, so the bar travels e - (MARGIN - GAP)

// Four-phase "inward gravity": resists leaving rest, slides freely, then is pulled into each detent.
function gravity(raw) {
  const a = Math.abs(raw);
  if (a <= STEP_1) {
    const p = a / STEP_1;
    if (p < 0.1) return a * 0.35;
    if (p < 0.9) return a;
    return STEP_1 - (STEP_1 - a) * 0.35;
  }
  const d2 = a - STEP_1;
  const p2 = Math.min(1, d2 / SPAN_2);
  if (p2 < 0.1) return STEP_1 + d2 * 0.35;
  if (p2 < 0.9) return STEP_1 + d2;
  if (a <= STEP_2) return STEP_2 - (STEP_2 - (STEP_1 + d2)) * 0.35;
  return STEP_2 + Math.min(22, (a - STEP_2) * 0.22);   // rubber-band squash past option 2
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { decks: START_DECKS.map((d) => Object.assign({}, d)), open: null, drag: null, anim: null, removing: null, toast: null, lastDeleted: null };
    this.raf = null;
    this.ptr = null;
    this.justDragged = false;
  }
  componentWillUnmount() {
    cancelAnimationFrame(this.raf);
    clearTimeout(this.toastTimer);
  }

  showToast(text, undo) {
    clearTimeout(this.toastTimer);
    this.setState({ toast: { text, undo: !!undo, plain: !undo } });
    this.toastTimer = setTimeout(() => this.setState({ toast: null }), undo ? 3200 : 1800);
  }

  // Spring engine with opening overshoot (+12px) and squash rebound (-9px).
  animateTo(id, dir, from, target, overshoot) {
    cancelAnimationFrame(this.raf);
    let cur = from;
    let vel = 0;
    let over = target;
    if (overshoot) {
      if (target > from) over = target + 12;
      else if (from > target + 1) over = target - 9;
    }
    let phase = overshoot && Math.abs(over - target) > 1 ? 'over' : 'settle';
    const step = () => {
      const dest = phase === 'over' ? over : target;
      vel = (vel + (dest - cur) * 0.16) * 0.74;
      cur += vel;
      if (phase === 'over' && Math.abs(cur - over) < 1.2) phase = 'settle';
      else if (phase === 'settle' && Math.abs(cur - target) < 0.3 && Math.abs(vel) < 0.15) {
        this.setState({ anim: null, open: target ? { id, d: dir * target } : null });
        return;
      }
      this.setState({ anim: { id, val: Math.max(0, cur), dir } });
      this.raf = requestAnimationFrame(step);
    };
    step();
  }

  down(e, id) {
    if (this.state.removing) return;
    cancelAnimationFrame(this.raf);
    const s = this.state;
    let base = 0;
    if (s.anim && s.anim.id === id) base = s.anim.dir * s.anim.val;
    else if (s.open && s.open.id === id) base = s.open.d;
    else if (this.props.demoStates && !s.touched && DEMO_OPEN[id]) base = DEMO_OPEN[id];
    this.ptr = { id, sx: e.clientX - base, sy: e.clientY, base, moved: false, el: e.currentTarget, pid: e.pointerId };
    const patch = { anim: null, touched: true };          // the demo states release once you touch a deck
    if (s.open && s.open.id !== id) patch.open = null;   // only one deck open at a time
    if (s.anim && s.anim.id !== id) patch.anim = null;
    this.setState(patch);
  }

  move(e) {
    const p = this.ptr;
    if (!p) return;
    const dx = e.clientX - p.sx;
    if (!p.moved) {
      const ddx = Math.abs(e.clientX - (p.sx + p.base));
      const ddy = Math.abs(e.clientY - p.sy);
      if (ddy > 10 && ddy > ddx) { this.ptr = null; return; }  // vertical intent: let it scroll
      if (ddx < 6) return;
      p.moved = true;
      try { p.el.setPointerCapture(p.pid); } catch (err) {}
    }
    this.setState({ drag: { id: p.id, raw: Math.abs(dx), dir: dx < 0 ? -1 : 1 } });
  }

  up() {
    const p = this.ptr;
    this.ptr = null;
    if (!p) return;
    if (!p.moved) {
      if (p.base !== 0) {                              // tap on an open deck closes it
        this.justDragged = true;
        this.animateTo(p.id, Math.sign(p.base), Math.abs(p.base), 0, false);
      }
      return;
    }
    this.justDragged = true;
    const d = this.state.drag;
    if (!d) return;
    const from = gravity(d.raw);
    this.setState({ drag: null });
    if (d.raw <= STEP_1) {
      if (d.raw / STEP_1 < 0.5) this.animateTo(p.id, d.dir, from, 0, false);
      else this.animateTo(p.id, d.dir, from, STEP_1, true);
    } else if ((d.raw - STEP_1) / SPAN_2 < 0.5) {
      this.animateTo(p.id, d.dir, from, STEP_1, false);
    } else {
      this.animateTo(p.id, d.dir, from, STEP_2, true);
    }
  }

  remove(id, kind) {
    const deck = this.state.decks.find((x) => x.id === id);
    const index = this.state.decks.findIndex((x) => x.id === id);
    this.setState({ removing: { id, kind }, open: null, anim: null });
    setTimeout(() => {
      this.setState({ decks: this.state.decks.filter((x) => x.id !== id), removing: null, lastDeleted: { deck, index } });
      this.showToast((kind === 'delete' ? 'Deleted ' : 'Archived ') + deck.name, true);
    }, 360);
  }

  renderVals() {
    const t = (this.props.dark ?? false) ? THEMES.dark : THEMES.light;
    const s = this.state;
    const rows = s.decks.map((d) => {
      let e = 0;
      let dir = 0;
      let live = false;
      if (s.drag && s.drag.id === d.id) { e = gravity(s.drag.raw); dir = s.drag.dir; live = true; }
      else if (s.anim && s.anim.id === d.id) { e = s.anim.val; dir = s.anim.dir; live = true; }
      else if (s.open && s.open.id === d.id) { e = Math.abs(s.open.d); dir = Math.sign(s.open.d); }
      else if (this.props.demoStates && DEMO_OPEN[d.id] && !s.touched) { e = Math.abs(DEMO_OPEN[d.id]); dir = Math.sign(DEMO_OPEN[d.id]); }
      if (e < 0.5) { e = 0; dir = 0; }
      const excess = Math.max(0, e - STEP_2);
      const second = e <= STEP_1 ? 0 : Math.min(65, e - STEP_1) + excess * 0.45;
      const progress = e / STEP_1;
      const sinkOp = Math.min(1, progress * 1.5).toFixed(3);
      const stop = Math.max(0, 100 - progress * 20).toFixed(1);
      const rm = s.removing && s.removing.id === d.id ? s.removing.kind : null;
      return {
        name: d.name,
        pinned: d.pinned,
        aria: d.name + ', ' + d.cards + ' cards. Swipe left to delete or archive, right to move or pin',
        meta: d.cards + ' cards · ' + (d.due ? d.due + ' slipping' : 'all fresh'),
        tx: dir === 0 ? 0 : (dir * Math.max(0, e + GAP - MARGIN)).toFixed(1),
        layerR: dir < 0 ? e.toFixed(1) : 0,
        w1R: dir < 0 ? e.toFixed(1) : 0,
        w2R: dir < 0 ? second.toFixed(1) : 0,
        layerL: dir > 0 ? e.toFixed(1) : 0,
        w1L: dir > 0 ? e.toFixed(1) : 0,
        w2L: dir > 0 ? second.toFixed(1) : 0,
        tr: live ? 'none' : 'transform 260ms cubic-bezier(.2,.8,.2,1), width 260ms cubic-bezier(.2,.8,.2,1)',
        sinkLOp: dir < 0 ? sinkOp : 0,
        sinkROp: dir > 0 ? sinkOp : 0,
        sinkLBg: 'linear-gradient(to left, ' + t.canvasClear + ' 0%, ' + t.canvas + ' ' + stop + '%)',
        sinkRBg: 'linear-gradient(to right, ' + t.canvasClear + ' 0%, ' + t.canvas + ' ' + stop + '%)',
        ov: rm ? 'hidden' : 'visible',
        h: rm === 'delete' ? 0 : 72,
        mb: rm === 'delete' ? 0 : 12,
        op: rm ? 0 : 1,
        wrapTf: rm === 'archive' ? 'translateX(-110%)' : 'none',
        fan: [0, 1, 2, 3, 4].map((i) => ({
          style: 'right: ' + (-10 + (4 - i) * 15) + 'px; bottom: ' + (-40 + i * 8) + 'px; transform: rotate(' + (-16 + i * 3) + 'deg); background: ' + (i < d.mastered ? t.fanOn[i] : t.fanOff) + ';'
        })),
        pinLabel: d.pinned ? 'Unpin deck' : 'Pin deck to the top',
        down: (ev) => this.down(ev, d.id),
        click: (ev) => {
          if (this.justDragged || (s.open && s.open.id === d.id)) { ev.preventDefault(); this.justDragged = false; }
        },
        del: () => this.remove(d.id, 'delete'),
        arc: () => this.remove(d.id, 'archive'),
        move: () => {
          this.animateTo(d.id, 1, e, 0, false);
          this.showToast('Move ' + d.name + ' to… German · Coding · Travel');
        },
        pin: () => {
          const decks = s.decks.map((x) => (x.id === d.id ? Object.assign({}, x, { pinned: !x.pinned }) : x));
          decks.sort((a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0));
          this.setState({ decks, open: null, anim: null });
          this.showToast(d.pinned ? 'Unpinned ' + d.name : 'Pinned ' + d.name + ' to the top');
        }
      };
    });
    const toast = s.toast || { text: '', undo: false, plain: true };
    return {
      t, rows,
      noDrag: (ev) => ev.preventDefault(),   // stop the browser's native "drag this link" from hijacking the swipe
      onMove: (ev) => this.move(ev),
      onUp: () => this.up(),
      hasToast: !!s.toast,
      toast,
      undo: () => {
        const ld = s.lastDeleted;
        if (!ld) return;
        const decks = s.decks.slice();
        decks.splice(Math.min(ld.index, decks.length), 0, ld.deck);
        this.setState({ decks, lastDeleted: null, toast: null });
      }
    };
  }
}
</script>
</body>
</html>
