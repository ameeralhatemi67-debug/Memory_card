        <sc-for list="{{d.fan}}" as="c" hint-placeholder-count="5">

<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const THEMES = {
  light: { canvas: '#F1F1F1', canvasClear: 'rgba(241,241,241,0)', ink: '#333333', onInk: '#F1F1F1', muted: '#666666', mutedOnInk: '#BDBDBD', soft: '#E3E3E3',
           fanOn: ['#8F8F8F', '#A8A8A8', '#C2C2C2', '#DADADA', '#F1F1F1'], fanOff: '#454545' },
  dark:  { canvas: '#333333', canvasClear: 'rgba(51,51,51,0)', ink: '#F1F1F1', onInk: '#333333', muted: '#BDBDBD', mutedOnInk: '#666666', soft: '#424242',
           fanOn: ['#A3A3A3', '#888888', '#6E6E6E', '#525252', '#333333'], fanOff: '#DADADA' }
};
const DECKS = [
  { name: 'Spanish · Basics', cards: 45, due: 12, mastered: 3 },
  { name: 'Spanish · Verbs', cards: 60, due: 18, mastered: 2 },
  { name: 'French · Essentials', cards: 50, due: 9, mastered: 4 },
  { name: 'French · Food', cards: 36, due: 0, mastered: 5 },
  { name: 'Arabic · Alphabet', cards: 28, due: 7, mastered: 1 },
  { name: 'Arabic · Greetings', cards: 30, due: 15, mastered: 0 },
  { name: 'English · Idioms', cards: 40, due: 0, mastered: 2 }
];
class Component extends DCLogic {
  renderVals() {
    const t = (this.props.dark ?? false) ? THEMES.dark : THEMES.light;
    const decks = DECKS.map((d) => ({
      name: d.name,
      meta: d.cards + ' cards · ' + (d.due ? d.due + ' slipping' : 'all fresh'),
      fan: [0, 1, 2, 3, 4].map((i) => ({
        style: 'right: ' + (4 + (4 - i) * 21) + 'px; bottom: ' + (-44 + i * 9) + 'px; transform: rotate(' + (-16 + i * 3) + 'deg); background: ' + (i < d.mastered ? t.fanOn[i] : t.fanOff) + ';'
      }))
    }));
    return { t, decks };
  }
}
</script>
