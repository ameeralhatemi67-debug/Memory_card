<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Deck preview</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,700..900&amp;family=Barlow+Semi+Condensed:wght@400;500;600;700&amp;display=swap">
<style>
body{margin:0}
a{color:inherit}a:hover{color:inherit}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.canvas}}; color: {{t.ink}}; font-family: 'Barlow Semi Condensed', system-ui, sans-serif;">
  <div aria-hidden="true" style="position: absolute; left: 18px; right: 18px; top: 86px; height: 54px; border-radius: 10px; background: {{t.ink}};"></div>
  <a href="Shop.dc.html" aria-label="Close preview" style="position: absolute; inset: 0; background: rgba(20,20,20,0.55);"></a>

  <section role="dialog" aria-label="German · A1 Basics" style="position: absolute; left: 0; right: 0; top: 64px; bottom: 0; background: {{t.canvas}}; border-radius: 26px 26px 0 0; box-sizing: border-box; padding: 10px 20px 22px; display: flex; flex-direction: column; box-shadow: {{t.sheet}};">
    <div aria-hidden="true" style="align-self: center; width: 44px; height: 5px; border-radius: 3px; background: {{t.line}};"></div>

    <div style="position: relative; height: 196px; margin-top: 14px;">
      <div aria-hidden="true" style="position: absolute; left: 76px; top: 18px; width: 214px; height: 150px; border-radius: 16px; background: {{t.back2}}; transform: rotate(-7deg); box-shadow: {{t.e1}};"></div>
      <div aria-hidden="true" style="position: absolute; left: 84px; top: 12px; width: 214px; height: 150px; border-radius: 16px; background: {{t.back1}}; transform: rotate(5deg); box-shadow: {{t.e1}};"></div>
      <button onClick="{{flip}}" aria-label="{{sampleAria}}" style="position: absolute; left: 80px; top: 14px; width: 214px; height: 150px; border: 0; border-radius: 16px; box-shadow: {{t.e2}}; background: {{sampleBg}}; color: {{sampleFg}}; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; transition: background 200ms ease;">
        <span style="font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; opacity: 0.75;">{{sampleLabel}}</span>
        <span style="font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 34px; line-height: 1;">{{sampleText}}</span>
      </button>
      <div style="position: absolute; left: 0; right: 0; bottom: 0; text-align: center; font-size: 13px; font-weight: 600; color: {{t.muted}};">Sample card · tap to flip</div>
    </div>

    <h1 style="margin: 12px 0 0; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 38px; line-height: 1;">German · A1 Basics</h1>
    <div style="margin-top: 6px; font-size: 15px; font-weight: 600; color: {{t.muted}};">Memory Card Originals · Free</div>

    <div style="margin-top: 14px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
      <div style="border-radius: 12px; background: {{t.soft}}; padding: 10px 12px; box-shadow: {{t.e1}};"><div style="font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 26px; line-height: 1;">120</div><div style="font-size: 13px; font-weight: 600; color: {{t.muted}}; margin-top: 3px;">cards</div></div>
      <div style="border-radius: 12px; background: {{t.soft}}; padding: 10px 12px; box-shadow: {{t.e1}};"><div style="font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 26px; line-height: 1;">A1</div><div style="font-size: 13px; font-weight: 600; color: {{t.muted}}; margin-top: 3px;">level</div></div>
      <div style="border-radius: 12px; background: {{t.soft}}; padding: 10px 12px; box-shadow: {{t.e1}};"><div style="font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 26px; line-height: 1;">Audio</div><div style="font-size: 13px; font-weight: 600; color: {{t.muted}}; margin-top: 3px;">every word</div></div>
    </div>

    <p style="margin: 12px 0 0; font-size: 16px; font-weight: 500; line-height: 1.4;">The 120 everyday nouns and verbs you meet first, each with an example sentence and pronunciation. Comes with its reverse cards.</p>

    <div style="margin-top: 14px; font-size: 13px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: {{t.muted}};">Add to folder</div>
    <div role="radiogroup" aria-label="Folder" style="margin-top: 8px; display: flex; gap: 8px; flex-wrap: wrap;">
      <sc-for list="{{folders}}" as="f" hint-placeholder-count="3">
        <button role="radio" aria-checked="{{f.on}}" onClick="{{f.pick}}" style="height: 36px; padding: 0 14px; border: 0; border-radius: 18px; font-family: inherit; font-size: 15px; font-weight: 700; cursor: pointer; background: {{f.bg}}; color: {{f.fg}};">{{f.name}}</button>
      </sc-for>
    </div>

    <div style="flex: 1;"></div>
    <a href="Main.dc.html" style="display: flex; height: 58px; align-items: center; justify-content: center; border-radius: 16px; background: {{t.ink}}; color: {{t.canvas}}; text-decoration: none; box-shadow: {{t.e2}}; font-family: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif; font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 25px;">{{addLabel}}</a>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":false},"$preview":{"width":390,"height":844}}'>
const THEMES = {
  light: { canvas: '#F1F1F1', ink: '#333333', onInk: '#F1F1F1', muted: '#666666', soft: '#E3E3E3', line: '#D2D2D2', back1: '#9D9D9D', back2: '#C4C4C4',
           e1: '0 1px 2px rgba(0,0,0,0.12), 0 5px 12px rgba(0,0,0,0.12)', e2: '0 2px 4px rgba(0,0,0,0.12), 0 10px 24px rgba(0,0,0,0.2)', sheet: '0 -10px 30px rgba(0,0,0,0.22)' },
  dark:  { canvas: '#333333', ink: '#F1F1F1', onInk: '#333333', muted: '#BDBDBD', soft: '#444444', line: '#555555', back1: '#8A8A8A', back2: '#5E5E5E',
           e1: '0 1px 2px rgba(0,0,0,0.45), 0 5px 12px rgba(0,0,0,0.4)', e2: '0 2px 6px rgba(0,0,0,0.5), 0 12px 28px rgba(0,0,0,0.55)', sheet: '0 -12px 34px rgba(0,0,0,0.55)' }
};
const FOLDERS = ['German', 'Languages', 'New folder'];
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { flipped: false, folder: 'German' };
  }
  renderVals() {
    const t = (this.props.dark ?? false) ? THEMES.dark : THEMES.light;
    const f = this.state.flipped;
    const folders = FOLDERS.map((name) => {
      const on = this.state.folder === name;
      return { name: name === 'New folder' ? '+ New folder' : name, on, bg: on ? t.ink : t.soft, fg: on ? t.canvas : t.ink, pick: () => this.setState({ folder: name }) };
    });
    return {
      t, folders,
      flip: () => this.setState({ flipped: !f }),
      sampleBg: f ? '#FFC680' : t.ink,
      sampleFg: f ? '#333333' : t.onInk,
      sampleLabel: f ? 'Answer' : 'noun · masculine',
      sampleText: f ? 'the apple' : 'der Apfel',
      sampleAria: f ? 'Answer: the apple. Tap to flip back' : 'Sample card: der Apfel. Tap to flip',
      addLabel: 'Add 120 cards to ' + (this.state.folder === 'New folder' ? 'a new folder' : this.state.folder)
    };
  }
}
</script>
</body>
</html>
