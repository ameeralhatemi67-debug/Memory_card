<title>Memory Card Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+Display:wdth,wght@62.5..100,700..900&family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
/* Layout: lab panels either side of a phone frame on desktop; the bare app, scaled to the screen, on a phone. */
:root {
  --bg: #DEDEDB; --fg: #262626; --panel: #F3F3F1; --panel-line: #D2D2CE; --muted-fg: #62625E; --accent: #B84848; --chip: #E6E6E3;
  --display: 'Bernard MT Condensed', 'Noto Serif Display', Georgia, serif;
  --body: 'Barlow Semi Condensed', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #1B1B1B; --fg: #E9E9E7; --panel: #262626; --panel-line: #3A3A3A; --muted-fg: #A9A9A5; --accent: #E58181; --chip: #333333; color-scheme: dark; }
}
:root[data-theme="dark"] { --bg: #1B1B1B; --fg: #E9E9E7; --panel: #262626; --panel-line: #3A3A3A; --muted-fg: #A9A9A5; --accent: #E58181; --chip: #333333; color-scheme: dark; }
html, body { height: 100%; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; overflow: hidden; }
#app { height: 100%; }
.boot { margin: 0; padding: 40px max(16px, env(safe-area-inset-left, 0px)); text-align: center; font-size: 17px; color: var(--muted-fg); }

/* ---------- shell ---------- */
.shell { height: 100%; display: grid; grid-template-columns: minmax(230px, 300px) minmax(420px, 1fr) minmax(270px, 340px); gap: 20px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); box-sizing: border-box; }
@media (max-width: 1180px) { .shell { grid-template-columns: minmax(420px, 1fr) minmax(270px, 340px); } .panel.left { display: none; } }
.panel { overflow-y: auto; padding-block: 22px; scrollbar-width: thin; min-width: 0; }
.panel-inner { display: flex; flex-direction: column; gap: 12px; }
.stage { position: relative; display: flex; align-items: center; justify-content: center; min-width: 0; height: 100%; overflow: hidden; }
.device { position: relative; background: #111111; box-shadow: 0 30px 80px rgba(0,0,0,0.28), inset 0 0 0 2px #2C2C2C; flex: none; }
.brand { display: flex; align-items: center; gap: 12px; }
.brand-logo { display: block; width: 30px; height: 38px; color: var(--fg); }
.brand-name { font-family: var(--display); font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 28px; line-height: 1; }
.brand-sub { font-size: 14px; font-weight: 600; color: var(--muted-fg); margin-top: 2px; }
.lede { margin: 4px 0 0; font-size: 16px; line-height: 1.45; max-width: 34ch; }
.panel-inner h3 { margin: 10px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 1.3px; text-transform: uppercase; color: var(--muted-fg); }
.lab-card h3 { margin: 0 0 8px; }
.tries { margin: 0; padding-left: 18px; display: flex; flex-direction: column; gap: 6px; font-size: 15px; line-height: 1.4; }
.keys { margin: 0; font-size: 14px; line-height: 2; color: var(--muted-fg); }
kbd { display: inline-block; min-width: 22px; padding: 0 6px; margin-right: 2px; border-radius: 6px; background: var(--chip); color: var(--fg); font-family: var(--body); font-weight: 700; text-align: center; line-height: 24px; }
.jump { display: flex; flex-wrap: wrap; gap: 6px; }
.jump-btn { height: 34px; padding: 0 12px; border: 1px solid var(--panel-line); border-radius: 17px; background: var(--panel); color: var(--fg); font-family: var(--body); font-size: 14px; font-weight: 700; cursor: pointer; }
.jump-btn:hover { border-color: var(--fg); }
.jump-btn:disabled { opacity: 0.45; cursor: default; }
.jump-btn.wide { width: 100%; }
.jump-btn.danger { background: var(--accent); border-color: var(--accent); color: #FFFFFF; }
.lab-card { background: var(--panel); border: 1px solid var(--panel-line); border-radius: 16px; padding: 14px; }
.note-card { background: var(--fg); color: var(--bg); border-color: var(--fg); }
.note-btn { width: 100%; height: 46px; display: flex; align-items: center; justify-content: center; gap: 8px; border: 0; border-radius: 12px; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 16px; font-weight: 700; cursor: pointer; }
.note-card .hint { color: var(--bg); opacity: 0.8; }
.hint { margin: 8px 0 0; font-size: 13px; line-height: 1.4; color: var(--muted-fg); }
.xr-title { margin: 0 0 6px; font-family: var(--display); font-stretch: 62.5%; font-weight: 800; font-synthesis: none; font-size: 20px; }
.xr-grid { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 3px 12px; font-size: 14px; }
.xr-grid span { color: var(--muted-fg); }
.xr-grid b { font-weight: 700; min-width: 0; }
.xr-last { margin: 10px 0 0; padding: 8px 10px; border-radius: 10px; background: var(--chip); font-size: 14px; line-height: 1.35; }
.xr-stack { list-style: none; margin: 10px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.xr-stack li { display: grid; grid-template-columns: 22px minmax(0, 1fr) 48px; gap: 6px; align-items: center; font-size: 14px; }
.xr-pos { color: var(--muted-fg); font-variant-numeric: tabular-nums; text-align: right; }
.xr-term { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
.xr-r { font-variant-numeric: tabular-nums; text-align: right; font-weight: 700; color: var(--fg); background: linear-gradient(to right, var(--chip) calc(var(--r) * 100%), transparent 0); border-radius: 6px; padding: 0 4px; }
.lab-seg { background: var(--chip) !important; }
.lab-seg button { color: var(--fg) !important; height: 34px !important; font-size: 14px !important; }
.lab-seg button.on { background: var(--fg) !important; color: var(--bg) !important; }
.lab-close { height: 36px; padding: 0 14px; border: 0; border-radius: 18px; background: var(--fg); color: var(--bg); font-family: var(--body); font-weight: 700; font-size: 15px; cursor: pointer; }
.mobile-stage { position: fixed; left: 0; right: 0; top: env(safe-area-inset-top, 0px); bottom: env(safe-area-inset-bottom, 0px); overflow: hidden; }
.lab-tab { position: fixed; right: 0; top: 50%; transform: translateY(-50%); width: 22px; height: 66px; padding: 0; border: 0; border-radius: 10px 0 0 10px;
  background: rgba(51,51,51,0.72); color: #F1F1F1; font-family: var(--body); font-size: 11px; font-weight: 700; letter-spacing: 2px; writing-mode: vertical-rl; cursor: pointer; z-index: 200; }
.lab-sheet { position: fixed; inset: 0; z-index: 300; background: var(--bg); overflow-y: auto; box-sizing: border-box;
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(24px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); }
:focus-visible { outline: 3px solid #80AEFF; outline-offset: 2px; }

/* ---------- the app (tokens from the design canvas; .dark is the inverse-ink theme) ---------- */
.phone {
  --canvas: #F1F1F1; --canvas-clear: rgba(241,241,241,0); --ink: #333333; --on-ink: #F1F1F1; --muted: #666666; --muted-on-ink: #BDBDBD; --soft: #E3E3E3; --well: #D6D6D6;
  --line: #D2D2D2; --field: #FFFFFF; --dash: #9D9D9D; --knob-off: #FFFFFF; --off-bg: #BDBDBD; --track: #CFCFCF; --pill: #E3E3E3; --ear-back: #5C5C5C; --err: #B23B3B;
  --e1: 0 1px 2px rgba(0,0,0,0.12), 0 5px 12px rgba(0,0,0,0.12); --e2: 0 2px 4px rgba(0,0,0,0.12), 0 10px 24px rgba(0,0,0,0.2); --e3: 0 24px 60px rgba(0,0,0,0.35);
  --card-e: 0 2px 4px rgba(0,0,0,0.12), 0 8px 18px rgba(0,0,0,0.14); --sheet: 0 -10px 30px rgba(0,0,0,0.22);
  --back1: #9D9D9D; --back2: #C4C4C4; --hero-back1: #747474; --hero-back2: #5A5A5A; --tile-card: 0 4px 10px rgba(0,0,0,0.25);
  --ink2: #555555; --gloss: rgba(255,255,255,0.16); --art: drop-shadow(0 10px 16px rgba(0,0,0,0.22)); --seal-shadow: drop-shadow(0 8px 14px rgba(0,0,0,0.28));
  --drawer-dim: rgba(141,141,141,0.84); --backdrop-ink: #5E5E5E;
  --sash: #AEAEAE; --digits: #9A9A9A; --card-face: #F8F8F8; --face-shadow: 0 18px 40px rgba(0,0,0,0.10); --badge: #333333; --badge-ink: #F1F1F1; --stripe: #1E1E1E;
  --pcard: 0 16px 36px rgba(0,0,0,0.24); --badge-shadow: drop-shadow(0 6px 10px rgba(0,0,0,0.25));
  position: absolute; transform-origin: 0 0; overflow: hidden; border-radius: 36px; background: var(--canvas); color: var(--ink);
  font-family: var(--body); font-size: 15px; -webkit-tap-highlight-color: transparent; color-scheme: light;
}
.mobile-stage .phone { border-radius: 0; }
.phone.dark {
  --canvas: #333333; --canvas-clear: rgba(51,51,51,0); --ink: #F1F1F1; --on-ink: #333333; --muted: #BDBDBD; --muted-on-ink: #666666; --soft: #444444; --well: #555555;
  --line: #555555; --field: #2B2B2B; --dash: #777777; --knob-off: #BDBDBD; --off-bg: #666666; --track: #5A5A5A; --pill: #D6D6D6; --ear-back: #CFCFCF; --err: #FF9A9A;
  --e1: 0 1px 2px rgba(0,0,0,0.45), 0 5px 12px rgba(0,0,0,0.4); --e2: 0 2px 6px rgba(0,0,0,0.5), 0 12px 28px rgba(0,0,0,0.55); --e3: 0 24px 60px rgba(0,0,0,0.6);
  --card-e: 0 2px 6px rgba(0,0,0,0.45), 0 10px 22px rgba(0,0,0,0.45); --sheet: 0 -12px 34px rgba(0,0,0,0.55);
  --back1: #8A8A8A; --back2: #5E5E5E; --hero-back1: #BDBDBD; --hero-back2: #9D9D9D; --tile-card: 0 4px 10px rgba(0,0,0,0.45);
  --ink2: #C4C4C4; --gloss: rgba(255,255,255,0.7); --art: drop-shadow(0 10px 18px rgba(0,0,0,0.6)); --seal-shadow: drop-shadow(0 8px 16px rgba(0,0,0,0.6));
  --drawer-dim: rgba(77,77,77,0.9); --backdrop-ink: #8A8A8A;
  --sash: #8A8A8A; --digits: #8A8A8A; --card-face: #3B3B3B; --face-shadow: 0 18px 40px rgba(0,0,0,0.45); --badge: #F1F1F1; --badge-ink: #333333; --stripe: #C8C8C8;
  --pcard: 0 18px 40px rgba(0,0,0,0.6); --badge-shadow: drop-shadow(0 6px 12px rgba(0,0,0,0.6));
  color-scheme: dark;
}
.phone button { font-family: inherit; -webkit-tap-highlight-color: transparent; }
.phone button > span, .ibtn > span, .nav-btn > span { display: block; }
.d { font-family: var(--display); font-stretch: 62.5%; font-weight: 800; font-synthesis: none; }
.code { font-family: ui-monospace, 'Cascadia Mono', Consolas, Menlo, monospace; font-weight: 600; letter-spacing: -0.3px; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.muted { color: var(--muted); }
.scr { position: absolute; inset: 0; overflow: hidden; background: var(--canvas); color: var(--ink); user-select: none; -webkit-user-select: none; animation: scrIn 200ms ease; }
.scroll { position: absolute; left: 0; right: 0; overflow-y: auto; overflow-x: hidden; scrollbar-width: none; }
.scroll::-webkit-scrollbar, .deck-list::-webkit-scrollbar, .shop-scroll::-webkit-scrollbar, .sheet-body::-webkit-scrollbar { display: none; }
.push { position: absolute; inset: 0; transition: transform 320ms cubic-bezier(.2,.8,.2,1); }
.push.on { transform: translateX(280px); }

.hdr { position: absolute; top: 0; left: 0; right: 0; height: 76px; box-sizing: border-box; padding: 18px 16px 0 18px; display: flex; align-items: center; gap: 12px; z-index: 5; transition: opacity 200ms ease; }
.hdr.hide { opacity: 0; pointer-events: none; }
.study-hdr { height: 68px; padding-top: 16px; }
.hdr-title { flex: 1; min-width: 0; font-size: 24px; line-height: 1; }
.hdr-sub { font-size: 13px; font-weight: 600; color: var(--muted); margin-top: 3px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.ibtn { width: 44px; height: 44px; border: 0; padding: 0; background: transparent; color: var(--ink); display: flex; align-items: center; justify-content: center; cursor: pointer; flex: none; border-radius: 12px; }
.ibtn:active { transform: scale(0.94); }
.streak-pill { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 12px; border: 0; border-radius: 16px; background: var(--soft); color: var(--ink); font-size: 15px; font-weight: 600; box-shadow: var(--e1); cursor: pointer; flex: none; }

.nav { position: absolute; left: 0; right: 0; bottom: 0; height: 112px; display: flex; align-items: center; justify-content: space-around; padding: 0 22px 10px; box-sizing: border-box; background: var(--canvas); z-index: 6; }
.nav-btn { width: 56px; height: 56px; display: flex; align-items: center; justify-content: center; border: 0; padding: 0; background: transparent; color: var(--ink); cursor: pointer; }
.nav-btn:active { transform: scale(0.92); }
.nav-plus { position: relative; width: 84px; height: 84px; border: 0; padding: 0; background: transparent; color: var(--canvas); display: flex; align-items: center; justify-content: center; cursor: pointer; }
.nav-plus .diamond { position: absolute; left: 13px; top: 13px; width: 58px; height: 58px; border-radius: 15px; background: var(--ink); transform: rotate(45deg); box-shadow: var(--e2); transition: transform 160ms ease; }
.nav-plus:active .diamond { transform: rotate(45deg) scale(0.9); }
.nav-plus .plus { position: relative; display: flex; }

.toast { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 8px; max-width: 366px; height: 38px; padding: 0 6px 0 16px; box-sizing: border-box; border-radius: 19px;
  background: var(--ink); color: var(--canvas); font-size: 15px; font-weight: 700; white-space: nowrap; z-index: 90; box-shadow: var(--e2); animation: toastIn 220ms ease; }
.toast > span:first-child { overflow: hidden; text-overflow: ellipsis; }
.toast-undo { flex: none; height: 28px; padding: 0 12px; border: 0; border-radius: 14px; background: var(--canvas); color: var(--ink); font-size: 14px; font-weight: 700; cursor: pointer; }

/* decks */
.deck-list { position: absolute; top: 84px; left: 0; right: 0; bottom: 0; overflow-y: auto; overflow-x: hidden; padding: 4px 0 240px; box-sizing: border-box; scrollbar-width: none; }
.deck-row { position: relative; transition: height 300ms ease, margin 300ms ease, opacity 300ms ease, transform 350ms ease; }
.act-layer { position: absolute; top: 0; bottom: 0; overflow: hidden; }
.act-layer.right { right: 0; }
.act-layer.left { left: 0; }
.act { position: absolute; top: 0; bottom: 0; height: 72px; border: 0; padding: 0; color: #333333; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
.act-r { right: 0; border-radius: 16px 0 0 16px; }
.act-l { left: 0; border-radius: 0 16px 16px 0; }
.act-ico { flex: none; height: 100%; display: flex; align-items: center; justify-content: center; }
.deck-bar { position: absolute; top: 0; left: 20px; width: 350px; height: 72px; border: 0; padding: 0; border-radius: 10px; background: var(--ink); color: var(--on-ink); overflow: hidden; text-align: left;
  touch-action: pan-y; -webkit-user-drag: none; cursor: grab; z-index: 3; box-shadow: var(--e1); }
.deck-name { position: absolute; left: 16px; top: 11px; right: 112px; display: flex; align-items: center; gap: 6px; font-size: 23px; line-height: 1.05; white-space: nowrap; overflow: hidden; }
.deck-meta { position: absolute; left: 16px; bottom: 11px; font-size: 13px; font-weight: 500; letter-spacing: 0.2px; color: var(--muted-on-ink); white-space: nowrap; }
.fan { position: absolute; width: 54px; height: 80px; border-radius: 7px; transform-origin: 100% 100%; box-shadow: -2px 0 4px rgba(0,0,0,0.2); }
.sink { position: absolute; top: -1px; bottom: -1px; width: 50%; pointer-events: none; z-index: 4; }
.list-fade { position: absolute; left: 0; right: 0; bottom: 112px; height: 210px; background: linear-gradient(to bottom, var(--canvas-clear), var(--canvas) 92%); pointer-events: none; }
.flash .deck-bar { animation: flash 1100ms ease; }

/* empty folder */
.empty { position: absolute; left: 0; right: 0; top: 76px; bottom: 0; }
.empty-top { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 34px 28px 0; }
.empty-copy { margin: 10px 0 0; font-size: 18px; font-weight: 500; color: var(--muted); line-height: 1.35; }
.starters { position: absolute; left: 0; right: 0; bottom: 124px; padding: 0 20px; }
.eyebrow { margin: 0; font-size: 14px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted); }
.eyebrow.on-ink { font-size: 12px; letter-spacing: 1.4px; color: var(--muted-on-ink); }
.starter-grid { margin-top: 10px; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.starter { display: flex; flex-direction: column; justify-content: space-between; height: 112px; box-sizing: border-box; padding: 12px; border: 0; border-radius: 40px 40px 14px 14px; box-shadow: var(--e1); cursor: pointer; }
.btn-ink { display: flex; align-items: center; justify-content: center; border: 0; border-radius: 16px; background: var(--ink); color: var(--canvas); box-shadow: var(--e2); cursor: pointer; flex: none; transition: transform 120ms ease; }
.btn-ink:active, .btn-soft:active { transform: scale(0.98); }
.btn-ink:disabled { opacity: 0.45; cursor: default; }
.btn-soft { display: flex; align-items: center; justify-content: center; border: 0; border-radius: 16px; background: var(--soft); color: var(--ink); font-size: 17px; font-weight: 600; box-shadow: var(--e1); cursor: pointer; flex: none; transition: transform 120ms ease; }
.btn-line { display: flex; align-items: center; justify-content: center; height: 48px; border: 2px solid var(--line); border-radius: 16px; background: transparent; color: var(--ink); font-size: 16px; font-weight: 700; cursor: pointer; box-sizing: border-box; flex: none; }

/* study */
.goalbar { position: absolute; top: 72px; left: 22px; right: 22px; height: 4px; border-radius: 2px; background: var(--soft); overflow: hidden; }
.goalbar > div { height: 100%; background: var(--ink); transition: width 300ms ease; }
.layer { position: absolute; left: 57px; width: 276px; border-radius: 18px; }
.card-under { background: var(--ink); color: var(--on-ink); box-sizing: border-box; padding: 20px; }
.empty-card { background: var(--ink); color: var(--on-ink); box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; box-shadow: var(--card-e); }
.card-top { position: absolute; left: 57px; width: 276px; touch-action: none; cursor: grab; z-index: 2; }
.card-top.flipper { perspective: 1200px; }
.card-inner { position: relative; width: 100%; height: 100%; transform-style: preserve-3d; transition: transform 460ms cubic-bezier(.3,1.25,.4,1); animation: cardIn 220ms ease; }
.flipper.flipped .card-inner { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; border-radius: 18px; background: var(--ink); color: var(--on-ink); box-sizing: border-box; padding: 20px; display: flex; flex-direction: column; box-shadow: var(--card-e);
  backface-visibility: hidden; -webkit-backface-visibility: hidden; overflow: hidden; }
.face.back { transform: rotateY(180deg); background: #FFC680; }
.card-label { font-size: 12px; font-weight: 700; letter-spacing: 1.2px; text-transform: uppercase; color: var(--muted-on-ink); }
.card-term { line-height: 1.05; margin-top: 6px; overflow-wrap: anywhere; }
.card-term.code { line-height: 1.25; }
.card-ex { font-size: 17px; font-weight: 500; line-height: 1.3; margin-top: 8px; color: var(--muted-on-ink); }
.card-img { margin-top: 10px; max-height: 96px; max-width: 100%; align-self: flex-start; border-radius: 10px; object-fit: cover; }
.answer { min-height: 56px; border-radius: 12px; background: #FFC680; color: #333333; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 28px; line-height: 1.05;
  padding: 6px 12px; box-sizing: border-box; flex: none; animation: answerIn 240ms cubic-bezier(.3,1.3,.5,1); }
.answer.long { font-size: 21px; }
.reveal-btn { height: 56px; border: 0; border-radius: 12px; background: var(--pill); color: #333333; font-size: 17px; font-weight: 600; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 8px; flex: none; }
.flip-hint { font-size: 14px; font-weight: 600; color: var(--muted-on-ink); text-align: center; padding: 6px 0; flex: none; }
.speak { margin-top: 10px; flex: none; border: 0; border-radius: 12px; background: #D35F5F; color: #F1F1F1; display: flex; align-items: center; justify-content: center; gap: 10px; cursor: pointer; font-size: 25px; }
.ear { position: absolute; width: 96px; height: 128px; border: 0; padding: 0; background: transparent; cursor: pointer; z-index: 3; }
.ear.left { left: 0; transform-origin: -150px -120px; }
.ear.right { right: 0; transform-origin: 246px -120px; }
.ear-back { position: absolute; top: 14px; width: 96px; height: 96px; border-radius: 16px; background: var(--ear-back); }
.ear-front { position: absolute; top: 16px; width: 96px; height: 96px; border-radius: 16px; background: var(--ink); transform: rotate(45deg); box-shadow: var(--e2); }
.ear-ico { position: absolute; top: 47px; width: 34px; height: 34px; color: var(--on-ink); }
.note-chip { position: absolute; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; height: 34px; padding: 0 4px 0 12px; border-radius: 17px; background: var(--soft); color: var(--ink);
  font-size: 14px; font-weight: 600; white-space: nowrap; box-shadow: var(--e2); z-index: 7; animation: toastIn 200ms ease; }
