      const out = CustomEase.create("mcOut", "M0,0 C0.23,1 0.32,1 1,1");
      const springy = CustomEase.create("mcSpringy", "M0,0 C0.34,1.35 0.5,1 1,1");
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const B = (n) => (n * 60) / 104;
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const P = window.MC_PLANS[vars.cut || "full"];
      const sq = (vars.format || "portrait") === "square";
      if (sq) document.getElementById("e-sheet").parentElement.classList.add("sq"); // the scene root
      const T0 = B(P.wipe); // this scene starts on the wipe's beat
      const L = (beat) => B(beat) - T0; // a beat in local seconds
      const below = (sq ? 1080 : 1920) + 60;

      gsap.set("#e-sheet", { y: below, rotation: 3, borderRadius: 64, transformOrigin: "50% 0%", boxShadow: "0px -24px 60px rgba(0,0,0,0.28)" });
      gsap.set(["#e-l1", "#e-l2", "#e-l3"], { transformOrigin: "50% 50%", opacity: 0 });
      gsap.set(["#e-line", "#e-badge"], { opacity: 0 });
      gsap.set("#e-name", { clipPath: "inset(0% 100% 0% 0%)" });
      tl.fromTo("#e-sheet", { y: below, rotation: 3, borderRadius: 64, boxShadow: "0px -24px 60px rgba(0,0,0,0.28)" },
        { y: 0, rotation: 0, borderRadius: 0, boxShadow: "0px 0px 0px rgba(0,0,0,0)", duration: 0.48, ease: "power3.inOut" }, 0);

      // The logo deals itself from the bottom right (where the hand of cards is held), one card a half beat.
      const fl = P.flightS, from = sq ? { x: 420, y: 760 } : { x: 520, y: 1150 };
      const cards = [["#e-l1", 0, L(P.deals[0])], ["#e-l2", 15, L(P.deals[1])], ["#e-l3", 30, L(P.deals[2])]];
      cards.forEach(([el, r, land]) => {
        tl.set(el, { opacity: 1 }, land - fl);
        tl.fromTo(el, from, { x: 0, y: 0, duration: fl, ease: "power3.out" }, land - fl);
        tl.fromTo(el, { rotation: r - 34, scale: 1.08 }, { rotation: r, scale: 1, duration: fl, ease: springy }, land - fl);
      });

      const l3 = L(P.deals[2]), [en, el, ep] = P.endS;
      tl.fromTo("#e-name", { clipPath: "inset(0% 100% 0% 0%)" }, { clipPath: "inset(0% 0% 0% 0%)", duration: 0.4, ease: "power2.out" }, l3 + en);

      tl.fromTo("#e-badge", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.22, ease: out }, l3 + ep);

      tl.set("#e-sheet", { x: 0 }, P.duration - T0);
      window.__timelines["endcard"] = tl;
    })();
