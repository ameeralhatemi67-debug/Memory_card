  <script>
    (function () {
      gsap.registerPlugin(CustomEase);
      const paper = CustomEase.create("mcPaper", "M0,0 C0.2,0.8 0.2,1 1,1");
      const springy = CustomEase.create("mcSpringy", "M0,0 C0.34,1.35 0.5,1 1,1");
      const out = CustomEase.create("mcOut", "M0,0 C0.23,1 0.32,1 1,1");
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const B = (n) => (n * 60) / 104; // beat n in seconds (104 BPM)
      const qa = (s) => Array.from(document.querySelectorAll(s));

      // Which cut and frame shape this mount plays (assets/plans.js).
      const vars = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
      const P = window.MC_PLANS[vars.cut || "full"];
      const F = window.MC_FORMATS[vars.format || "portrait"];
      const H = P.hook;
      const [hx, hy, hs] = F.hook, [sx, sy, ss] = F.shot;

      // First time an ease reaches v (the app swaps the flip's face at 90 degrees).
      const cross = (ease, v) => { let lo = 0, hi = 1; for (let i = 0; i < 40; i++) { const m = (lo + hi) / 2; if (ease(m) < v) lo = m; else hi = m; } return hi; };

      // The study screen's drag maths (study_screen.dart): rotation, sag and shrink follow dx.
      const rot = (dx) => Math.max(-28, Math.min(28, dx * 0.09));
      const sag = (dx) => Math.min(140, dx * dx * 0.0005);
      const shrink = (dx) => 1 - 0.14 * Math.min(1, Math.abs(dx) / 276);
      const drag = (el, t0, t1, dx0, dx1, ease) =>
        tl.fromTo(el, { x: dx0, y: sag(dx0), rotation: rot(dx0), scale: shrink(dx0) },
          { x: dx1, y: sag(dx1), rotation: rot(dx1), scale: shrink(dx1), duration: t1 - t0, ease }, t0);
      // Horizontal motion blur on a flight, peaking on its fastest frames.
      const blur = (el, t0) => {
        tl.set(el, { filter: "url(#f-hb)" }, t0);
        tl.fromTo("#f-hb-blur", { attr: { stdDeviation: "0 0" } }, { attr: { stdDeviation: "9 0" }, duration: 0.05, ease: "none" }, t0);
        tl.fromTo("#f-hb-blur", { attr: { stdDeviation: "9 0" } }, { attr: { stdDeviation: "0 0" }, duration: 0.17, ease: "power1.out" }, t0 + 0.05);
        tl.set(el, { filter: "none" }, t0 + 0.23);
      };
      const flip = (id, t, from = 0) => {
        tl.fromTo(`#${id}-flip`, { rotationY: from }, { rotationY: from + 180, duration: 0.52, ease: springy }, t);
        const tc = t + 0.52 * cross(springy, 0.5);
        tl.set(`#${id}-front`, { opacity: 0 }, tc);
        tl.set(`#${id}-back`, { opacity: 1 }, tc);
      };
      // Ears: right -48 deg out, 0 in, +5 past the commit line; left mirrored.
      const ear = (side, t, a0, a1, dur, ease) => {
        const s = side === "R" ? -1 : 1;
        tl.fromTo(`#f-ear${side}`, { rotation: s * a0 }, { rotation: s * a1, duration: dur, ease }, t);
      };
      const setN = (n, t) => {
        tl.set("#f-num-col", { y: -16 * (n - 10) }, t);
        tl.fromTo("#f-goal-fill", { scaleX: (n - 1) / 20 }, { scaleX: n / 20, duration: 0.3, ease: "power1.out" }, t);
      };
      const showDeck = (id, t) => qa("#f-hdr .hd").forEach((e) => tl.set(e, { opacity: e.classList.contains("hd-" + id) ? 1 : 0 }, t));
      const dot = (x, y, t) => tl.set("#f-touch", { x, y }, t);
      const dotDown = (t) => tl.fromTo("#f-touch", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out" }, t);
      const dotUp = (t) => tl.fromTo("#f-touch", { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.15, duration: 0.14, ease: "power1.out" }, t);

      // ---------- Initial state (frame 0), set outside the timeline so it renders at once ----------
      gsap.set("#f-cam", { transformOrigin: "0 0", x: hx, y: hy, scale: hs });
      gsap.set(["#f-status", "#f-hdr", "#f-goal", "#f-nav", ".above", "#f-chip", "#f-dim", "#f-seal"], { opacity: 0 });
      gsap.set("#f-stack", { y: 560 });
      gsap.set("#f-this-out", { y: -560 });
      gsap.set("#f-this-in", { y: 0, scale: 1, opacity: 1, textShadow: "0px 14px 16px rgba(0,0,0,0.5)" });
      gsap.set(".f-c1-part", { opacity: 0, filter: "blur(8px)" });
      gsap.set(["#f-c2-lbl", "#f-c2-prompt", ".f-c2-rest", "#f-c3-lbl", "#f-c3-prompt", ".f-c3-rest"], { opacity: 0 });
      gsap.set(["#f-c1-flip", "#f-c2-flip"], { transformPerspective: 833, rotationY: 0 });
      gsap.set(".mcard", { autoAlpha: 0 });
      gsap.set(".edge", { opacity: 0 });
      gsap.set("#f-earR", { rotation: -48 });
      gsap.set("#f-earL", { rotation: 48 });
      gsap.set("#f-num-col", { y: -16 * (P.startN - 10) });
      gsap.set("#f-goal-fill", { scaleX: P.startN / 20 });
      gsap.set("#f-touch", { opacity: 0, x: 200, y: 405 });
      gsap.set("#f-flood", { opacity: 0 });
      gsap.set("#f-seal", { transformOrigin: "50% 50%", y: P.sealY });
      gsap.set("#f-shake", { x: 0, y: 0 });
      qa("#f-hdr .hd").forEach((e) => gsap.set(e, { opacity: e.classList.contains("hd-es") ? 1 : 0 }));

      // ---------- Hook: the letters lose their ink, left to right ----------
      qa("#f-hk1 span, #f-hk2 span").forEach((el, i) => {
        tl.fromTo(el, { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(3px)", duration: 0.36, ease: "power1.in" }, H.fadeS + i * H.staggerS);
      });

      // ---------- The stack rises and catches THIS ----------
      const [r0, r1, r2] = H.riseS;
      tl.fromTo("#f-stack", { y: 560 }, { y: 100, duration: r1 - r0, ease: "none" }, r0);
      tl.fromTo("#f-stack", { y: 100 }, { y: 0, duration: r2 - r1, ease: "power2.out" }, r1);
      tl.fromTo("#f-this-out", { y: -560 }, { y: -100, duration: r1 - r0, ease: "none" }, r0);
      tl.fromTo("#f-this-out", { y: -100 }, { y: 0, duration: r2 - r1, ease: "power2.out" }, r1);
      tl.set("#f-hk3", { opacity: 0 }, r2);
      // THIS falls onto the card and lands on its beat.
      const land = B(H.land);
      tl.fromTo("#f-this-in", { y: 0, scale: 1, textShadow: "0px 14px 16px rgba(0,0,0,0.5)" },
        { y: 13.04, scale: 0.736, textShadow: "0px 2px 3px rgba(0,0,0,0.25)", duration: land - H.dropS, ease: "power2.in" }, H.dropS);
      tl.fromTo("#f-stack", { y: 0 }, { y: 3, duration: 0.07, ease: "power1.out" }, land);
      tl.fromTo("#f-stack", { y: 3 }, { y: 0, duration: 0.26, ease: springy }, land + 0.07);

      // ---------- Camera pulls back to the phone ----------
      const [p0, pd] = H.pullS;
      tl.fromTo("#f-cam", { x: hx, y: hy, scale: hs }, { x: sx, y: sy, scale: ss, duration: pd, ease: "power2.inOut" }, p0);
      tl.fromTo(".above", { opacity: 0 }, { opacity: 1, duration: 0.3, ease: "power1.out" }, p0 - 0.05);
      tl.fromTo(["#f-status", "#f-hdr", "#f-goal"], { opacity: 0, y: -12 }, { opacity: 1, y: 0, duration: 0.45, ease: paper, stagger: 0.05 }, H.uiS);
      tl.fromTo("#f-nav", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.45, ease: paper }, H.uiS + 0.05);
      if (H.swapS != null) {
        // THIS becomes the first card: el gato.
        tl.fromTo("#f-this-in", { opacity: 1, filter: "blur(0px)" }, { opacity: 0, filter: "blur(8px)", duration: 0.16, ease: "power1.in" }, H.swapS);
        tl.fromTo(".f-c1-part", { opacity: 0, filter: "blur(8px)" }, { opacity: 1, filter: "blur(0px)", duration: 0.18, ease: "power2.out", stagger: 0.04 }, H.swapS + 0.12);
      }

      // When the montage cuts in (the hero section hands over to it).
      const cutIn = P.montage.length ? B(P.montage[0][1]) - 0.29 : null;

      if (P.tap != null) {
        // ---------- Think. Tap. ----------
        const tap = B(P.tap);
        dot(200, 405, tap - 0.115); dotDown(tap - 0.115);
        dotUp(tap);
        flip("f-c1", tap);

        // ---------- Knew it? Drag right, release on its beat ----------
        const R1 = B(P.release1);
        dot(168, 430, R1 - 1.043); dotDown(R1 - 1.043);
        drag("#f-c1", R1 - 0.973, R1 - 0.123, 0, 182, "sine.inOut");
        drag("#f-c1", R1 - 0.123, R1, 182, 190, "none");
        tl.fromTo("#f-touch", { x: 168, y: 430 }, { x: 350, y: 446.6, duration: 0.85, ease: "sine.inOut" }, R1 - 0.973);
        tl.fromTo("#f-touch", { x: 350, y: 446.6 }, { x: 358, y: 448, duration: 0.123, ease: "none" }, R1 - 0.123);
        ear("R", R1 - 0.973, 48, 0, 0.48, "sine.in");
        ear("R", R1 - 0.288, 0, -5, 0.07, "power1.out");
        tl.fromTo("#f-c1-edge", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, R1 - 0.288);
        tl.fromTo(["#f-c2-lbl", "#f-c2-prompt"], { opacity: 0 }, { opacity: 0.66, duration: 0.85, ease: "sine.inOut" }, R1 - 0.973);
        tl.fromTo(["#f-c2-lbl", "#f-c2-prompt"], { opacity: 0.66 }, { opacity: 0.69, duration: 0.123, ease: "none" }, R1 - 0.123);
        // Release: the card flies off right (a touch slower than the app so the flight reads on video).
        dotUp(R1);
        drag("#f-c1", R1, R1 + 0.32, 190, 550, "power1.out");
        blur("#f-c1", R1);
        ear("R", R1, -5, 48, 0.34, springy);
        tl.fromTo("#f-c1-edge", { opacity: 1 }, { opacity: 0, duration: 0.15, ease: "power1.in" }, R1 + 0.03);
        tl.fromTo(["#f-c2-lbl", "#f-c2-prompt"], { opacity: 0.69 }, { opacity: 1, duration: 0.23, ease: paper }, R1);
        tl.set("#f-c1", { autoAlpha: 0 }, R1 + 0.32);
        tl.fromTo(".f-c2-rest", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, R1 + 0.23);
        setN(P.startN + 1, R1 + 0.23);

        // ---------- Not yet? Flip, drag left, release on its beat ----------
        const ny = B(P.notYet), R2 = B(P.release2);
        dot(195, 400, ny - 0.1); dotDown(ny - 0.1);
        dotUp(ny);
        flip("f-c2", ny);
        dot(222, 432, R2 - 0.754); dotDown(R2 - 0.754);
        drag("#f-c2", R2 - 0.674, R2 - 0.154, 0, -186, "sine.inOut");
        drag("#f-c2", R2 - 0.154, R2, -186, -192, "none");
        tl.fromTo("#f-touch", { x: 222, y: 432 }, { x: 36, y: 449.3, duration: 0.52, ease: "sine.inOut" }, R2 - 0.674);
        tl.fromTo("#f-touch", { x: 36, y: 449.3 }, { x: 30, y: 450.4, duration: 0.154, ease: "none" }, R2 - 0.154);
        ear("L", R2 - 0.674, 48, 0, 0.29, "sine.in");
        ear("L", R2 - 0.264, 0, -5, 0.06, "power1.out");
        tl.fromTo("#f-c2-edge", { opacity: 0 }, { opacity: 1, duration: 0.11, ease: "power1.out" }, R2 - 0.264);
        tl.fromTo(["#f-c3-lbl", "#f-c3-prompt"], { opacity: 0 }, { opacity: 0.67, duration: 0.52, ease: "sine.inOut" }, R2 - 0.674);
        tl.fromTo(["#f-c3-lbl", "#f-c3-prompt"], { opacity: 0.67 }, { opacity: 0.7, duration: 0.154, ease: "none" }, R2 - 0.154);
        dotUp(R2);
        drag("#f-c2", R2, R2 + 0.22, -192, -400, "power2.out");
        blur("#f-c2", R2);
        ear("L", R2, -5, 48, 0.34, springy);
        tl.fromTo(["#f-c3-lbl", "#f-c3-prompt"], { opacity: 0.7 }, { opacity: 1, duration: 0.22, ease: paper }, R2);
        tl.fromTo(".f-c3-rest", { opacity: 0 }, { opacity: 1, duration: 0.12, ease: "power1.out" }, R2 + 0.22);
        setN(P.startN + 2, R2 + 0.22);
        // It comes back: off screen it turns face down, slides back in under the new top card and stays
        // there as a red-edged sliver until the montage cuts in.
        const tk = R2 + 0.225;
        tl.set("#f-c2", { zIndex: 2 }, tk);
        tl.fromTo("#f-c2-flip", { rotationY: 180 }, { rotationY: 360, duration: 0.12, ease: "power1.inOut" }, tk);
        tl.set("#f-c2-back", { opacity: 0 }, tk + 0.06);
        tl.set("#f-c2-front", { opacity: 1 }, tk + 0.06);
        tl.fromTo("#f-c2", { x: -400, y: sag(-400), rotation: -28, scale: shrink(-400) },
          { x: -16, y: 40, rotation: 0, scale: 1, duration: 0.44, ease: "power3.out" }, tk + 0.12);
        tl.fromTo("#f-c2", { x: -16 }, { x: 0, duration: 0.2, ease: "power2.in" }, cutIn - 0.235);
        tl.fromTo("#f-c2-edge", { opacity: 1 }, { opacity: 0, duration: 0.16, ease: "power1.in" }, cutIn - 0.195);
        tl.set("#f-c2", { autoAlpha: 0 }, cutIn - 0.025);
        // The chip: Back in 1 ... 12 cards.
        tl.fromTo("#f-chip", { opacity: 0, scale: 0.92 }, { opacity: 1, scale: 1, duration: 0.22, ease: out }, R2 + 0.246);
        tl.fromTo("#f-cnt-col", { y: 0 }, { y: -17 * 11, duration: 0.45, ease: "steps(11)" }, R2 + 0.296);
      }

      // ---------- Montage: one card per beat ----------
      const looks = {
        "f-m0": { deck: "ds", col: "#B59CFF", dir: 1 }, "f-m1": { deck: "fe", col: "#6FD0C8", dir: 1 },
        "f-m2": { deck: "ce", col: "#79C267", dir: 1 }, "f-m3": { deck: "ff", col: "#80AEFF", dir: -1 },
        "f-m4": { deck: "ds", col: "#B59CFF", dir: 1 }, "f-m5": { deck: "fa", col: "#6FD0C8", dir: 1 },
        "f-m6": { deck: "ce", col: "#79C267", dir: 1 }, "f-m7": { deck: "ff", col: "#80AEFF", dir: 1 },
      };
      // Each shot is cut on the previous card's flight, with two blurred frames of it on screen: 0.07 s after a release.
      P.montage.forEach(([id, beat], k) => {
        const sh = looks[id], tb = B(beat), d = sh.dir, side = d > 0 ? "R" : "L";
        const s = k === 0 ? cutIn : B(P.montage[k - 1][1]) + 0.07;
        const el = "#" + id, last = k === P.montage.length - 1;
        if (k === 0) {
          tl.set(["#f-c3", "#f-chip"], { autoAlpha: 0 }, s);
          tl.set("#f-flood", { opacity: 1 }, s);
        }
        tl.set(el, { autoAlpha: 1 }, s);
        tl.set("#f-flood", { backgroundColor: sh.col }, s);
        showDeck(sh.deck, s);
        tl.set(`#f-ear${side === "R" ? "L" : "R"}`, { rotation: side === "R" ? 48 : -48 }, s);
        drag(el, s, tb, 24 * d, 172 * d, "power2.in");
        ear(side, s, 48 * (1 - 24 / 110), 0, Math.min(0.24, tb - s - 0.08), "power1.in");
        ear(side, tb - 0.07, 0, -5, 0.07, "power1.out");
        tl.fromTo(`${el} .edge`, { opacity: 0 }, { opacity: 1, duration: 0.07, ease: "none" }, tb - 0.07);
        drag(el, tb, tb + 0.3, 172 * d, 560 * d, "power1.out");
        blur(el, tb);
        // The ear swings out with the flight; the cut takes it away mid-swing (the next shot resets it).
        ear(side, tb, -5, 48, last ? 0.34 : 0.07, last ? springy : "power1.in");
        tl.set(el, { autoAlpha: 0 }, last ? tb + 0.3 : tb + 0.07);
        setN(P.startN + 3 + k, last ? tb + 0.3 : tb + 0.07);
      });
      if (!P.montage.length) setN(20, B(P.stamp) - 0.6);

      // ---------- Goal: back to paper, the DONE seal stamps on its beat ----------
      const st = B(P.stamp);
      tl.set("#f-flood", { opacity: 0 }, st - 0.38);
      tl.fromTo("#f-dim", { opacity: 0 }, { opacity: 1, duration: 0.2, ease: "power1.out" }, st - 0.38);
      const t0 = st - 0.315;
      tl.fromTo("#f-seal", { opacity: 0, scale: 1.5, rotation: -22 }, { opacity: 1, scale: 0.92, rotation: -2, duration: 0.315, ease: "sine.inOut" }, t0);
      tl.fromTo("#f-seal", { scale: 0.92, rotation: -2 }, { scale: 1.04, rotation: 1, duration: 0.175, ease: "sine.inOut" }, t0 + 0.315);
      tl.fromTo("#f-seal", { scale: 1.04, rotation: 1 }, { scale: 1, rotation: 0, duration: 0.21, ease: "sine.inOut" }, t0 + 0.49);
      // Two frames of camera shake on the impact.
      tl.set("#f-shake", { x: 8, y: -6 }, st);
      tl.set("#f-shake", { x: -5, y: 4 }, st + 1 / 30);
      tl.set("#f-shake", { x: 0, y: 0 }, st + 2 / 30);

      tl.set("#f-shake", { x: 0 }, P.duration);
      window.__timelines["film"] = tl;
    })();
  </script>
</template>
