  <script>
    (function () {
      gsap.registerPlugin(CustomEase);
      const paper = CustomEase.create("mcPaper", "M0,0 C0.2,0.8 0.2,1 1,1");
      const springy = CustomEase.create("mcSpringy", "M0,0 C0.34,1.35 0.5,1 1,1");
      const tl = gsap.timeline({ paused: true, defaults: { immediateRender: false } });
      const B = (n) => (n * 60) / 108; // beat n in seconds (108 BPM)
      const $ = (s) => document.querySelector(s);
      const kit = window.MC_WGKIT;
      const END = B(44); // the montage cuts in

      // ---------- Widgets: one layer per state in each slot ----------
      const L = {}; // slot -> state -> { el, pieces }
      const layer = (slot, state, key) => {
        const el = document.createElement("div");
        el.className = "wgl";
        $("#" + slot).appendChild(el);
        const pieces = kit.mount(el, key);
        (L[slot] = L[slot] || {})[state] = { el, pieces, key };
        return L[slot][state];
      };
      const page1 = [["s1-streak", "StreakWidget_4x1"], ["s1-seal", "SealWidget_2x2"], ["s1-actions", "ActionsGridWidget_2x2"], ["s1-today", "TodayWidget_4x2"]];
      page1.forEach(([slot, w]) => {
        layer(slot, "a", w + "_a_red_day");
        layer(slot, "h", w + "_h_red_day");
        layer(slot, "b", w + "_b_red_day");
        layer(slot, "blue", w + "_b_blue_day");
        layer(slot, "green", w + "_b_green_day");
        layer(slot, "night", w + "_b_green_night");
      });
      layer("s2-quick", "a", "QuickCardWidget_4x2_a_red_day");
      layer("s2-quick", "d", "QuickCardWidget_4x2_d_red_day");
      layer("s2-quick", "h", "QuickCardWidget_4x2_h_red_day");
      layer("s2-member", "a", "MembershipWidget_4x2_a_red_day");
      layer("s2-member", "g", "MembershipWidget_4x2_g_red_day");
      layer("s2-seals", "a", "SealsWidget_4x1_a_red_day");

      // The goal seal's own 20 / 20: the red seal and its DONE are stamped, the rest of the face fades in.
      const sealB = L["s1-seal"].b;
      const bFace = sealB.el.querySelector(".wg-face");
      const bInk = sealB.el.querySelector(".wg-ink");
      const stamp = document.createElement("div");
      Object.assign(stamp.style, { position: "absolute", inset: "0" });
      sealB.el.insertBefore(stamp, bInk);
      stamp.appendChild(sealB.pieces[0].box);
      const stampInk = bInk.cloneNode();
      stampInk.style.clipPath = "circle(46px at 86px 92.78px)";
      stamp.appendChild(stampInk);
      bInk.style.clipPath = "inset(140px 0 0 0)";

      // The ring sweeping from 13 to the goal: the widget's own arc and count, drawn over the 13 / 20 face.
      const R = 31.28, CIRC = 2 * Math.PI * R;
      const sweep = document.createElementNS("http://www.w3.org/2000/svg", "svg");
      sweep.id = "h-sweep";
      sweep.setAttribute("viewBox", "0 0 172 233");
      let inner = `<circle cx="86" cy="92.78" r="28.4" fill="#E1E1E1"/>` +
        `<circle id="h-arc" cx="86" cy="92.78" r="${R}" fill="none" stroke="#D35F5F" stroke-width="4.6" stroke-linecap="round" stroke-dasharray="${CIRC}" stroke-dashoffset="${CIRC * (1 - 13 / 20)}" transform="rotate(-90 86 92.78)"/>` +
        `<rect x="12" y="140" width="148" height="31" fill="#F1F1F1"/>`;
      for (let n = 13; n <= 19; n++) {
        inner += `<text class="h-n" data-n="${n}" x="86" y="101.3" font-size="21.62" text-anchor="middle" opacity="0">${n}/20</text>`;
        inner += `<text class="h-t" data-n="${n}" x="86" y="165.22" font-size="27" text-anchor="middle" opacity="0">${20 - n} to go</text>`;
      }
      sweep.innerHTML = inner;
      $("#s1-seal").appendChild(sweep);

      const show = (slot, state, t) => tl.set(L[slot][state].el, { opacity: 1 }, t);
      const hide = (slot, state, t) => tl.set(L[slot][state].el, { opacity: 0 }, t);
      const run = (slot, state, t0, t1, age = 0) => kit.animate(tl, L[slot][state].pieces, t0, t1, age);
      // The launcher's refresh (wg_fade_out / wg_fade_in): the old drawing dissolves, the new one rises 6 % into place.
      const refresh = (slot, from, to, t) => {
        const a = L[slot][from].el, b = L[slot][to].el, h = window.MC_WIDGETS[L[slot][to].key].h;
        tl.fromTo(a, { opacity: 1 }, { opacity: 0, duration: 0.26, ease: "none" }, t);
        tl.fromTo(b, { opacity: 0, y: h * 0.06 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, t);
      };

      // ---------- Camera ----------
      const CAM = {
        shot: { x: 231.75, y: 470, scale: 1.5 },
        quick: { x: 57.08, y: 470, scale: 2.35 },
        seal: { x: 272.4, y: 470, scale: 2.4 },
        member: { x: 149.55, y: 470, scale: 1.9 },
        split: { x: 283.13, y: 872.5, scale: 1.25 },
        dive: { x: -35.4, y: -300, scale: 2.8 }, // the screen fills the frame: the montage cuts in on its wallpaper
      };
      const move = (from, to, t, d = 0.6) => tl.fromTo("#h-cam", CAM[from], { ...CAM[to], duration: d, ease: "power2.inOut" }, t);
      const toPage = (n, t) => {
        tl.fromTo("#h-pages", { x: n === 2 ? 0 : -411 }, { x: n === 2 ? -411 : 0, duration: 0.45, ease: "power3.inOut" }, t);
        tl.fromTo("#h-wall", { x: n === 2 ? 0 : -30 }, { x: n === 2 ? -30 : 0, duration: 0.45, ease: "power3.inOut" }, t);
        tl.set("#h-dot1", { opacity: n === 1 ? 1 : 0.45 }, t + 0.22);
        tl.set("#h-dot2", { opacity: n === 2 ? 1 : 0.45 }, t + 0.22);
      };
      const tap = (x, y, t) => {
        tl.set("#h-touch", { x, y }, t - 0.1);
        tl.fromTo("#h-touch", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out" }, t - 0.1);
        tl.fromTo("#h-touch", { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.15, duration: 0.14, ease: "power1.out" }, t);
      };
      // The launcher's turn (wg_turn_out / wg_turn_in): the card narrows to its edge, the other side opens out.
      const turn = (slot, from, to, t) => {
        const a = L[slot][from].el, b = L[slot][to].el;
        gsap.set([a, b], { transformOrigin: "50% 50%" });
        tl.fromTo(a, { scaleX: 1 }, { scaleX: 0.02, duration: 0.17, ease: "power1.in" }, t);
        tl.set(a, { opacity: 0 }, t + 0.17);
        tl.set(b, { opacity: 1, scaleX: 0.02 }, t + 0.16);
        tl.fromTo(b, { scaleX: 0.02 }, { scaleX: 1, duration: 0.21, ease: "power1.out" }, t + 0.16);
      };
      // The launcher's swap (wg_swap_out / wg_swap_in): one side slips away left, the other comes round from the right.
      const swap = (slot, from, to, t) => {
        const a = L[slot][from].el, b = L[slot][to].el;
        gsap.set([a, b], { transformOrigin: "50% 50%" });
        tl.fromTo(a, { x: 0, y: 0, rotation: 0, scale: 1, opacity: 1 }, { x: -86.4, y: 16.3, rotation: -11, scale: 0.86, opacity: 0, duration: 0.3, ease: "power1.in" }, t);
        tl.fromTo(b, { x: 86.4, y: 16.3, rotation: 11, scale: 0.86 }, { x: 0, y: 0, rotation: 0, scale: 1, duration: 0.42, ease: "back.out(2)" }, t + 0.07);
        tl.fromTo(b, { opacity: 0 }, { opacity: 1, duration: 0.25, ease: "power2.out" }, t + 0.07);
      };

      // ---------- Initial state ----------
      gsap.set("#h-cam", { transformOrigin: "0 0", ...CAM.shot });
      gsap.set("#h-pages", { x: 0 });
      gsap.set("#h-wall", { x: 0 });
      gsap.set(".wgl", { opacity: 0 });
      gsap.set("#h-touch", { opacity: 0 });
      gsap.set("#h-sweep", { opacity: 0 });
      gsap.set([bFace, bInk, stamp], { opacity: 0 });
      gsap.set(stamp, { transformOrigin: "86px 92.78px" });
      gsap.set("#h-set", { y: -520, opacity: 0 });
      gsap.set("#h-set img", { opacity: 0 });
      gsap.set("#h-ftouch", { opacity: 0 });
      gsap.set("#h-shake", { x: 0, y: 0 });

      // ---------- Hook: the hand of cards rises, then deals four widgets, one per beat ----------
      // Each card is turned about a pivot 403 dp below its top (x 1.6), like the nav bar's hand.
      const cards = [["#h-c-home", -16], ["#h-c-lab", -8], ["#h-c-plus", 0], ["#h-c-shop", 8], ["#h-c-account", 16]];
      const rest = {};
      cards.forEach(([id, deg]) => {
        const a = (deg * Math.PI) / 180, arm = (403 - 49) * 1.6;
        rest[id] = { x: Math.sin(a) * arm, y: arm - Math.cos(a) * arm, rotation: deg, scale: 1.6 };
        gsap.set(id, { transformOrigin: "50% 50%", transformPerspective: 900, ...rest[id], y: rest[id].y + 95 }); // peeking on frame 0
      });
      cards.forEach(([id], i) => tl.fromTo(id, { y: rest[id].y + 95 }, { y: rest[id].y, duration: 0.9, ease: springy }, 0.15 + i * 0.05));
      // Card -> widget: it flies to its cell, goes edge-on, and the widget opens out of the turn.
      const deals = [["#h-c-account", "s1-streak", 3], ["#h-c-home", "s1-seal", 4], ["#h-c-lab", "s1-actions", 5], ["#h-c-shop", "s1-today", 6]];
      const cardCentre = { x: 172.5 + 33, y: 818 + 49 };
      deals.forEach(([id, slot, beat]) => {
        const s = $("#" + slot), w = window.MC_WIDGETS[L[slot].a.key];
        const cx = parseFloat(s.style.left) + w.w / 2, cy = parseFloat(s.style.top) + w.h / 2;
        const land = B(beat), go = land - 0.42;
        const to = { x: cx - cardCentre.x, y: cy - cardCentre.y };
        tl.fromTo(id, { x: rest[id].x, y: rest[id].y }, { x: to.x, y: to.y, duration: 0.42, ease: "power2.out" }, go);
        tl.fromTo(id, { rotation: rest[id].rotation, scale: 1.6 }, { rotation: 0, scale: 1.25, duration: 0.42, ease: "sine.inOut" }, go);
        tl.fromTo(id, { rotationY: 0 }, { rotationY: 90, duration: 0.14, ease: "power1.in" }, land - 0.14);
        tl.set(id, { autoAlpha: 0 }, land);
        const el = L[slot].a.el;
        gsap.set(el, { transformOrigin: "50% 50%", transformPerspective: 900 });
        tl.set(el, { opacity: 1 }, land);
        tl.fromTo(el, { rotationY: -90 }, { rotationY: 0, duration: 0.3, ease: "power2.out" }, land);
        tl.fromTo(el, { scale: 0.82 }, { scale: 1, duration: 0.42, ease: springy }, land);
        run(slot, "a", land, B(18));
      });
      tl.fromTo("#h-c-plus", { y: rest["#h-c-plus"].y }, { y: rest["#h-c-plus"].y + 330, duration: 0.35, ease: "power3.in" }, B(7));

      // ---------- Quick card: answered on the home screen ----------
      toPage(2, B(12));
      show("s2-quick", "a", 0); show("s2-member", "a", 0); show("s2-seals", "a", 0);
      run("s2-quick", "a", B(11.5), B(15));
      run("s2-member", "a", B(11.5), B(34));
      run("s2-seals", "a", B(11.5), B(34), 3);
      move("shot", "quick", B(13));
      tap(205.5, 263, B(15));
      turn("s2-quick", "a", "d", B(15));
      tap(290.5, 263, B(18));
      turn("s2-quick", "d", "h", B(18));
      // The answer reaches the other widgets (page 1 is out of sight).
      page1.forEach(([slot]) => { hide(slot, "a", B(18)); show(slot, "h", B(18)); run(slot, "h", B(18), B(26.3), 7); });
      move("quick", "shot", B(20), 0.55);

      // ---------- The goal seal fills and is stamped ----------
      toPage(1, B(21));
      move("shot", "seal", B(22));
      tl.set("#h-sweep", { opacity: 1 }, B(22.6));
      const n0 = B(23), n1 = B(25.5);
      tl.fromTo("#h-arc", { attr: { "stroke-dashoffset": CIRC * (1 - 13 / 20) } }, { attr: { "stroke-dashoffset": CIRC * (1 - 19.6 / 20) }, duration: n1 - n0, ease: "power1.inOut" }, n0);
      for (let n = 13; n <= 19; n++) {
        const t = n === 13 ? B(22.6) : n0 + ((n - 13) / 6) * (n1 - n0);
        tl.set(`#h-sweep .h-n[data-n="${n}"], #h-sweep .h-t[data-n="${n}"]`, { opacity: 1 }, t);
        if (n < 19) tl.set(`#h-sweep .h-n[data-n="${n}"], #h-sweep .h-t[data-n="${n}"]`, { opacity: 0 }, n0 + ((n - 12) / 6) * (n1 - n0));
      }
      // The stamp: the app's seal keyframes (celebrate.dart), impact on beat 26.
      const st = B(26), s0 = st - 0.315;
      tl.set(sealB.el, { opacity: 1 }, s0);
      tl.fromTo(stamp, { opacity: 0, scale: 1.5, rotation: -22 }, { opacity: 1, scale: 0.92, rotation: -2, duration: 0.315, ease: "sine.inOut" }, s0);
      tl.fromTo(stamp, { scale: 0.92, rotation: -2 }, { scale: 1.04, rotation: 1, duration: 0.175, ease: "sine.inOut" }, st);
      tl.fromTo(stamp, { scale: 1.04, rotation: 1 }, { scale: 1, rotation: 0, duration: 0.21, ease: "sine.inOut" }, st + 0.175);
      tl.set(bFace, { opacity: 1 }, st);
      tl.set(["#h-sweep", L["s1-seal"].h.el], { opacity: 0 }, st);
      tl.fromTo(bInk, { opacity: 0, y: 14 }, { opacity: 1, y: 0, duration: 0.32, ease: "power2.out" }, st + 0.05);
      run("s1-seal", "b", s0, B(36.2), 0);
      tl.set("#h-shake", { x: 8, y: -6 }, st);
      tl.set("#h-shake", { x: -5, y: 4 }, st + 1 / 30);
      tl.set("#h-shake", { x: 0, y: 0 }, st + 2 / 30);
      // The rest of page 1 catches up: goal met.
      [["s1-streak", 0.18], ["s1-actions", 0.26], ["s1-today", 0.34]].forEach(([slot, d]) => {
        refresh(slot, "h", "b", st + d);
        run(slot, "b", st + d, B(36.2), 7);
      });

      // ---------- The membership card turns over, and back ----------
      move("seal", "shot", B(27.5), 0.5);
      toPage(2, B(28));
      move("shot", "member", B(28.5), 0.5);
      tap(300, 450, B(29.5));
      swap("s2-member", "a", "g", B(29.5));
      run("s2-member", "g", B(29.5), B(32.5));
      tap(300, 450, B(32));
      swap("s2-member", "g", "a", B(32));

      // ---------- Make them yours: Settings above, the home screen below ----------
      toPage(1, B(34));
      move("member", "split", B(34), 0.6);
      tl.fromTo("#h-set", { y: -520, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: paper }, B(34.4));
      tl.set("#h-set-red", { opacity: 1 }, B(34.4));
      const ftap = (x, y, t) => {
        tl.set("#h-ftouch", { x, y }, t - 0.1);
        tl.fromTo("#h-ftouch", { opacity: 0, scale: 1.3 }, { opacity: 1, scale: 1, duration: 0.1, ease: "power2.out" }, t - 0.1);
        tl.fromTo("#h-ftouch", { opacity: 1, scale: 1 }, { opacity: 0, scale: 1.15, duration: 0.14, ease: "power1.out" }, t);
      };
      // Settings capture px -> frame px: x * 0.75 + 135, (y - 1190) * 0.75 + 420.
      const at = (x, y) => [x * 0.75 + 135, (y - 1190) * 0.75 + 420];
      const steps = [
        [B(36), at(551, 1574), "#h-set-red", "#h-set-blue", "b", "blue"],
        [B(38), at(414, 1574), "#h-set-blue", "#h-set-green", "blue", "green"],
        [B(40), at(833, 1346), "#h-set-green", "#h-set-dark", "green", "night"],
        [B(42), at(540, 1346), "#h-set-dark", "#h-set-light", "night", "green"],
      ];
      steps.forEach(([t, [x, y], img0, img1, from, to], k) => {
        ftap(x, y, t);
        tl.set(img1, { opacity: 1 }, t + 0.05);
        tl.set(img0, { opacity: 0 }, t + 0.05);
        // The wave: every widget on page 1 redraws, 60 ms apart from the top down.
        page1.forEach(([slot], i) => {
          const tw = t + 0.15 + i * 0.06;
          refresh(slot, from, to, tw);
          run(slot, to, tw, k === steps.length - 1 ? END : steps[k + 1][0] + 0.5, 9);
        });
      });

      // Into the glass: Settings lifts away with the title, the camera falls into the screen and the montage cuts on 44.
      tl.fromTo("#h-set", { y: 0, opacity: 1 }, { y: -60, opacity: 0, duration: 0.22, ease: "power1.in" }, B(43.4));
      tl.fromTo("#h-cam", CAM.split, { ...CAM.dive, duration: END - B(43.5), ease: "power2.in" }, B(43.5));

      tl.set("#h-shake", { x: 0 }, END);
      window.__timelines["home"] = tl;
    })();
  </script>
</template>
